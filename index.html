<title>バンドマン持ち物リスト</title>
<style>
  :root{
    --bg:#1c1b19;
    --panel:#242220;
    --panel-raised:#2c2925;
    --seam:#3a352e;
    --cream:#eee6d6;
    --cream-dim:#a89f8d;
    --amber:#e8a23c;
    --amber-dim:#8a6226;
    --teal:#4f8c85;
    --teal-dim:#2f524d;
    --red:#c1543c;
    --radius:10px;
    --field-bg:#1a1917;
    --nav-bg:#161513;
    --placeholder:#6d6558;
    --header-g1:#231f1c;
    --header-g2:#1c1b19;
  }
  :root[data-theme="light"]{
    --bg:#f6f1e7;
    --panel:#ffffff;
    --panel-raised:#f1ead9;
    --seam:#ddd2ba;
    --cream:#2a2520;
    --cream-dim:#8a8070;
    --amber:#c97f1e;
    --amber-dim:#f1dba8;
    --teal:#3f726c;
    --teal-dim:#dcebe8;
    --red:#b23b26;
    --field-bg:#ffffff;
    --nav-bg:#efe6d2;
    --placeholder:#b4a98e;
    --header-g1:#efe6d2;
    --header-g2:#f6f1e7;
  }
  :root{color-scheme:dark;--font-jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo","Yu Gothic UI","Yu Gothic",YuGothic,sans-serif;}
  /* フォームやボタンもページと同じフォントに（Windowsで明朝体・小さい文字になるのを防ぐ） */
  button,input,select,textarea{font-family:inherit;}
  button{font-size:inherit;}
  /* PC（マウス操作・広い画面）では全体を少し大きく */
  @media (min-width:640px) and (pointer:fine){ html{zoom:1.15;} }
  /* 広い画面では、ヘッダーとタブも本文と同じ幅に揃える */
  @media (min-width:560px){ html .nav,html .header{padding-left:max(16px, env(safe-area-inset-left, 0px), calc(50% - 224px));padding-right:max(16px, env(safe-area-inset-right, 0px), calc(50% - 224px));} html .header .led{right:max(20px, calc(50% - 216px));} }
  :root[data-theme="light"]{color-scheme:only light;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  /* clip は横はみ出しを防ぎつつ、メーターの追従表示（sticky）を妨げない */
  @supports (overflow:clip){ html,body{overflow-x:clip;} }
  html{background:var(--bg);}
  img,svg,textarea,select,input{max-width:100%;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:var(--font-jp);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  h1,h2,h3{
    font-family:'Oswald',var(--font-jp);
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
  }
  .header{
    padding:calc(22px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 16px max(18px, env(safe-area-inset-left, 0px));
    background:linear-gradient(180deg,var(--header-g1),var(--header-g2));
    border-bottom:1px solid var(--seam);
    position:relative;
  }
  .header .led{
    position:absolute;
    top:24px; right:20px;
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 6px 1px rgba(232,162,60,.7);
  }
  .header h1{font-size:19px;color:var(--cream);}
  .header p{margin:4px 0 0;font-size:12.5px;color:var(--cream-dim);}

  .container{width:100%;max-width:480px;margin:0 auto;padding:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}

  .panel{
    background:var(--panel);
    border:1px solid var(--seam);
    border-radius:var(--radius);
    padding:14px 14px 16px;
    margin-bottom:14px;
    overflow-x:hidden;
  }
  .panel-label{
    font-family:'Oswald',var(--font-jp);
    font-size:11px;
    letter-spacing:.08em;
    color:var(--amber);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .panel-label::before{
    content:'';
    width:5px;height:5px;border-radius:50%;
    background:var(--amber);
  }

  /* nav footswitches (under the header now) */
  .nav{
    display:flex;
    background:var(--nav-bg);
    border-bottom:1px solid var(--seam);
    padding:10px 10px;
    gap:8px;
  }
  .nav button{
    flex:1;
    background:var(--panel-raised);
    border:1px solid var(--seam);
    border-radius:8px;
    color:var(--cream);
    font-family:var(--font-jp);
    font-size:13.5px;
    font-weight:800;
    letter-spacing:.04em;
    padding:9px 2px;
    cursor:pointer;
  }
  .nav button{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .nav button.tab-dragging{position:relative;z-index:5;transition:none;box-shadow:0 6px 16px rgba(0,0,0,.25);transform-origin:center;}
  .nav button.tab-dragging{outline:2px solid var(--amber);outline-offset:1px;}
  .nav.tab-drag-on button:not(.tab-dragging){transition:transform .12s;}
  .nav button.active{
    color:#1c1b19;
    background:var(--amber);
    border-color:var(--amber);
  }

  /* form controls */
  input[type=text],input[type=date],input[type=time],select,textarea{
    width:100%;
    background:var(--field-bg);
    border:1px solid var(--seam);
    color:var(--cream);
    border-radius:7px;
    padding:9px 10px;
    font-size:14.5px;
    margin-bottom:8px;
  }
  input[type=date],input[type=time]{
    -webkit-appearance:none;
    appearance:none;
    min-width:0;
    display:block;
    height:38px;
    line-height:1.2;
    padding-left:6px;padding-right:6px;font-size:14px;
  }
  input,select,textarea,button{color-scheme:inherit;}
  :root[data-theme="light"] input[type=date],:root[data-theme="light"] input[type=time]{color-scheme:light;}
  input[type=text]::placeholder{color:var(--placeholder);}
  label.small{font-size:12px;color:var(--cream-dim);display:block;margin-bottom:4px;}

  .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{
    font-size:11.5px;
    padding:6px 12px;
    border-radius:99px;
    border:1px solid var(--seam);
    color:var(--cream-dim);
    background:var(--field-bg);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.on{
    background:var(--teal-dim);
    border-color:var(--teal);
    color:var(--cream);
  }
  .chip .x{margin-left:6px;color:var(--red);}
  .chip.static{cursor:default;}

  .btn{
    background:var(--amber-dim);
    border:1px solid var(--amber);
    color:var(--cream);
    border-radius:7px;
    padding:9px 14px;
    font-size:13.5px;
    font-family:'Oswald',var(--font-jp);
    letter-spacing:.02em;
    cursor:pointer;
    display:inline-block;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid var(--seam);
    color:var(--cream-dim);
  }
  .btn.danger{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
  }
  .btn.block{width:100%;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn:disabled:active{transform:none;}

  /* item rows */
  .item-row{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--seam);
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{font-size:14px;}
  .item-meta{font-size:11px;color:var(--cream-dim);margin-top:2px;}
  .del-x{
    color:var(--red);
    font-size:16px;
    padding:2px 8px;
    cursor:pointer;
    background:none;border:none;
  }

  /* entry cards (studio/live list) */
  .entry-card{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-raised);
    border:1px solid var(--seam);
    border-radius:8px;
    padding:12px 12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .entry-card .name{font-size:15px;font-weight:600;font-family:'Oswald',var(--font-jp);}
  .entry-card .progress{font-size:12px;color:var(--amber);white-space:nowrap;margin-left:10px;}

  .empty{
    text-align:center;
    color:var(--cream-dim);
    font-size:13px;
    padding:24px 8px;
  }

  /* checklist */
  .check-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 2px;
    border-bottom:1px solid var(--seam);
  }
  .check-row:last-child{border-bottom:none;}
  .group-head{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--amber);letter-spacing:.04em;padding:10px 2px 4px;border-bottom:1px solid var(--seam);}
  .group-head:first-child{padding-top:2px;}

  var TABORDER_KEY = 'gp-taborder-v1';
  function loadTabOrder(){
    var def = ['studio','live','recording'];
    try{
      var a = JSON.parse(localStorage.getItem(TABORDER_KEY)||'null');
      if(Array.isArray(a) && a.length===3 && def.every(function(m){ return a.indexOf(m)!==-1; })) return a;
    }catch(e){}
    return def;
  }
  var tabOrder = loadTabOrder();
  function saveTabOrder(){ try{ localStorage.setItem(TABORDER_KEY, JSON.stringify(tabOrder)); }catch(e){} }
  // ---------- タブを長押し → ドラッグで並べ替え（「設定」は常に右端） ----------
  var navDragJustEnded = false;
  function setupTabDrag(){
    var nav = document.querySelector('.nav');
    if(!nav || nav._dragReady) return;
    nav._dragReady = true;
    var st = null;   // {btn, id, x0, y0, timer, on, grab}
    function modeButtons(){ return Array.prototype.filter.call(nav.querySelectorAll('button[data-mode]'), function(b){ return b.dataset.mode!=='items'; }); }
    function natLeft(btn){ var t = btn.style.transform; btn.style.transform = ''; var l = btn.getBoundingClientRect().left; btn.style.transform = t; return l; }
    function startDrag(){
      if(!st) return;
      st.on = true;
      st.grab = st.x0 - st.btn.getBoundingClientRect().left;
      st.btn.classList.add('tab-dragging');
      nav.classList.add('tab-drag-on');
      try{ st.btn.setPointerCapture(st.id); }catch(e){}
      if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
    }
    function end(cancel){
      if(!st) return;
      clearTimeout(st.timer);
      if(st.on){
        st.btn.classList.remove('tab-dragging');
        st.btn.style.transform = '';
        nav.classList.remove('tab-drag-on');
        navDragJustEnded = true;
        setTimeout(function(){ navDragJustEnded = false; }, 350);
        var order = modeButtons().map(function(b){ return b.dataset.mode; });
        if(!cancel && order.join(',')!==tabOrder.join(',')){
          tabOrder = order;
          saveTabOrder();
          if(view.mode==='items') render();   // 設定の並び順表示も更新
        } else { applyTabOrder(); }
      }
      st = null;
    }
    nav.addEventListener('pointerdown', function(e){
      var btn = e.target.closest && e.target.closest('button[data-mode]');
      if(!btn || btn.dataset.mode==='items' || (e.button && e.button!==0)) return;
      st = {btn:btn, id:e.pointerId, x0:e.clientX, y0:e.clientY, on:false};
      st.timer = setTimeout(startDrag, e.pointerType==='mouse' ? 250 : 380);
    });
    window.addEventListener('pointermove', function(e){
      if(!st || e.pointerId!==st.id) return;
      if(!st.on){
        if(Math.abs(e.clientX-st.x0)>8 || Math.abs(e.clientY-st.y0)>8){ clearTimeout(st.timer); st = null; }
        return;
      }
      e.preventDefault();
      var btns = modeButtons();
      // 指の位置に合わせて並び順を入れ替える
      var others = btns.filter(function(b){ return b!==st.btn; });
      var idx = 0;
      others.forEach(function(b){ var r = b.getBoundingClientRect(); if(e.clientX > r.left + r.width/2) idx++; });
      var cur = btns.indexOf(st.btn);
      if(idx!==cur){
        var ref = others[idx] || null;
        if(ref) nav.insertBefore(st.btn, ref);
        else { var last = others[others.length-1]; nav.insertBefore(st.btn, last.nextSibling); }
      }
      // ボタンは指について動く（外側にはみ出しすぎないよう制限）
      var first = modeButtons()[0], lastB = modeButtons()[btns.length-1];
      var minL = natLeft(first), maxL = natLeft(lastB);
      var want = Math.max(minL, Math.min(maxL, e.clientX - st.grab));
      st.btn.style.transform = 'translateX('+(want - natLeft(st.btn))+'px) scale(1.04)';
    });
    window.addEventListener('pointerup', function(e){ if(st && e.pointerId===st.id) end(false); });
    window.addEventListener('pointercancel', function(e){ if(st && e.pointerId===st.id) end(true); });
    nav.addEventListener('contextmenu', function(e){ if(e.target.closest && e.target.closest('button[data-mode]')) e.preventDefault(); });
    nav.addEventListener('click', function(e){ if(navDragJustEnded){ e.stopPropagation(); e.preventDefault(); } }, true);
  }

  function applyTabOrder(){
    setupTabDrag();
    var nav = document.querySelector('.nav');
    if(!nav) return;
    tabOrder.forEach(function(m){

      var scopeOk = it.scope && it.scope.indexOf(mode)!==-1;
      if(!scopeOk) return false;
      if(!entryRoles || entryRoles.length===0) return true;
      if(!it.roles || it.roles.length===0) return true;
      return it.roles.some(function(r){ return entryRoles.indexOf(r)!==-1; });
    }).map(function(it){ return it.id; });
  }

  function migrateScope(scope){
    if(Array.isArray(scope)) return scope;
    if(scope==='both') return ['studio','live','recording'];
    if(scope==='studio') return ['studio'];
    if(scope==='live') return ['live'];
    return ['studio','live','recording'];
  }

  function migrateEntry(mode, e){
    if(!e.itemIds){
      e.itemIds = computeAutoItemIds(mode);
    }
    if(!e.updatedAt) e.updatedAt = 0;
    if(!e.endTime) e.endTime = '';
    delete e.tags;
    return e;

  // ---------- データの検査（バックアップ復元・保存データ読み込み時） ----------
  // 悪意のあるファイルを読み込んでも、決まった形・長さ・文字種の値だけを残し、それ以外は捨てる。
  var ID_RE = /^[A-Za-z0-9_-]{1,40}$/;
  var MAX_TEXT = 200, MAX_LIST = 5000;
  // 入力の上限（入力欄の文字数と、追加できる数）。読み込み時の安全装置（MAX_TEXT など）より小さくしてある
  var LIMIT = {name:50, role:20, items:5000, entries:5000, roles:200};
  function limitReached(what){
    var msg = {items:'持ち物は'+LIMIT.items+'件までです。使っていない持ち物を削除してから追加してください', entries:'予定は1つのタブに'+LIMIT.entries+'件までです。古い予定を削除してから追加してください', roles:'パートは'+LIMIT.roles+'個までです'}[what];
    showToast(msg);
  }
  function cleanText(v, max){
    if(typeof v!=='string') return '';
    // 制御文字（改行・タブ以外）を除き、長さを制限
    return v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'').slice(0, max||MAX_TEXT);
  }
  function cleanId(v){ return (typeof v==='string' && ID_RE.test(v)) ? v : null; }
  function cleanIdList(a){
    if(!Array.isArray(a)) return [];
    var out = [], seen = Object.create(null);
    a.slice(0, MAX_LIST).forEach(function(v){ var id = cleanId(v); if(id && !seen[id]){ seen[id] = true; out.push(id); } });
    return out;
  }
  function cleanTextList(a, max){
    if(!Array.isArray(a)) return [];
    var out = [];
    a.slice(0, 200).forEach(function(v){ var t = cleanText(v, max||40).trim(); if(t && out.indexOf(t)===-1) out.push(t); });
    return out;
  }
  function cleanIdMap(o, fn){
    var out = {};
    if(!o || typeof o!=='object' || Array.isArray(o)) return out;
    Object.keys(o).slice(0, MAX_LIST).forEach(function(k){
      if(!ID_RE.test(k)) return;              // __proto__ などの危険なキーもここで落ちる
      var v = fn(o[k]);
      if(v!==undefined) out[k] = v;
    });
    return out;
  }
  function cleanDate(v){ return (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : ''; }
  function cleanTime(v){ return (typeof v==='string' && /^\d{2}:\d{2}(:\d{2})?$/.test(v)) ? v : ''; }
  function sanitizeState(p){
    if(!p || typeof p!=='object' || !Array.isArray(p.items)) return null;
    var out = {};
    out.schemaVersion = (typeof p.schemaVersion==='number' && p.schemaVersion>0) ? Math.floor(p.schemaVersion) : 1;
    out.roles = Array.isArray(p.roles) ? cleanTextList(p.roles) : defaultRoles();
    out.defaultRoles = cleanTextList(p.defaultRoles);
    out.hiddenRoles = cleanTextList(p.hiddenRoles);
    if(typeof p.tagline==='string') out.tagline = cleanText(p.tagline, 60);
    var itemIds = Object.create(null);
    out.items = [];
    p.items.slice(0, MAX_LIST).forEach(function(it){
      if(!it || typeof it!=='object') return;
      var id = cleanId(it.id) || uid();
      if(itemIds[id]) return;
      var name = cleanText(it.name).trim() || '（名称なし）';
      itemIds[id] = true;
      var o = {id:id, name:name, scope:migrateScope(Array.isArray(it.scope) ? it.scope.filter(function(m){ return MODES.indexOf(m)!==-1; }) : it.scope), roles:cleanTextList(it.roles)};
      if(o.scope.length===0) o.scope = ['studio','live','recording'];
      if(it.bring===false) o.bring = false; else if(it.bring===true) o.bring = true;
      if(it.hand===true) o.hand = true;
      if(it.local===true){ o.local = true; var ow = cleanId(it.ownerId); if(ow) o.ownerId = ow; }
      out.items.push(o);
    });
    function cleanEntries(list){
      if(!Array.isArray(list)) return [];
      var seen = Object.create(null), res = [];
      list.slice(0, MAX_LIST).forEach(function(e){
        if(!e || typeof e!=='object') return;
        var id = cleanId(e.id) || uid();
        if(seen[id]) return;
        seen[id] = true;
        var o = {
          id:id, name:cleanText(e.name), date:cleanDate(e.date), time:cleanTime(e.time), endTime:cleanTime(e.endTime),
          artist:cleanText(e.artist), roles:cleanTextList(e.roles),
          itemIds:Array.isArray(e.itemIds) ? cleanIdList(e.itemIds) : undefined,
          bringOverride:cleanIdMap(e.bringOverride, function(v){ return typeof v==='boolean' ? v : undefined; }),
          nameOverride:cleanIdMap(e.nameOverride, function(v){ var t = cleanText(v).trim(); return t ? t : undefined; }),
          hiddenIds:cleanIdList(e.hiddenIds), pinnedIds:cleanIdList(e.pinnedIds),
          handIds:cleanIdList(e.handIds), handOff:cleanIdList(e.handOff),
          pinned:e.pinned===true, locked:e.locked===true,
          updatedAt:(typeof e.updatedAt==='number' && isFinite(e.updatedAt)) ? e.updatedAt : 0
        };
        if(!o.itemIds) delete o.itemIds;
        res.push(o);
      });
      return res;
    }
    out.studios = cleanEntries(p.studios);
    out.lives = cleanEntries(p.lives);
    out.recordings = cleanEntries(p.recordings);
    out.checks = {};
    if(p.checks && typeof p.checks==='object' && !Array.isArray(p.checks)){
      Object.keys(p.checks).slice(0, MAX_LIST).forEach(function(k){
        var m = /^(studio|live|recording):([A-Za-z0-9_-]{1,40})$/.exec(k);
        var v = p.checks[k];
        if(!m || !v || typeof v!=='object' || Array.isArray(v)) return;
        var c = {};
        Object.keys(v).slice(0, MAX_LIST).forEach(function(ik){
          if(!/^(h:)?[A-Za-z0-9_-]{1,40}$/.test(ik)) return;
          if(typeof v[ik]==='boolean') c[ik] = v[ik];
        });
        out.checks[k] = c;
      });
    }
    return out;
  }

  function loadState(){
    var raw = null;
    try{
      raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = sanitizeState(JSON.parse(raw));
      if(!parsed) return defaultState();
      if(!parsed.studios) parsed.studios = [];
      if(!parsed.lives) parsed.lives = [];
      if(!parsed.recordings) parsed.recordings = [];
      if(!parsed.roles) parsed.roles = defaultRoles();
      if(!parsed.schemaVersion) parsed.schemaVersion = 1;  // 形式1：v1.0〜（将来、形式を変えるときはここで変換する）
      parsed.items.forEach(function(it){ delete it.tags; if(!it.roles) it.roles = []; it.scope = migrateScope(it.scope); });
      state = parsed;
      parsed.studios.forEach(function(e){ migrateEntry('studio', e); });
      parsed.lives.forEach(function(e){ migrateEntry('live', e); });
      parsed.recordings.forEach(function(e){ migrateEntry('recording', e); });
      return parsed;
    }catch(e){
      // 読めなかったデータは消さずに別名で残しておく（上書きで失わないように）

  function addRoleToEntry(mode, entry, role){
    if(!entry.roles) entry.roles = [];
    if(entry.roles.indexOf(role)===-1) entry.roles.push(role);
    if(!entry.itemIds) entry.itemIds = [];
    var added = 0;
    state.items.forEach(function(it){
      if(it.local || !it.scope || it.scope.indexOf(mode)===-1) return;
      if((it.roles||[]).indexOf(role)===-1) return;
      if(entry.itemIds.indexOf(it.id)===-1){ entry.itemIds.push(it.id); added++; }
      if(entry.hiddenIds){ entry.hiddenIds = entry.hiddenIds.filter(function(id){ return id!==it.id; }); }
    });
    return added;
  }
  function removeRoleFromEntry(mode, entry, role, withItems){
    if(withItems){
      var ids = roleOnlyItems(mode, entry, role).removable.map(function(it){ return it.id; });
      entry.itemIds = (entry.itemIds||[]).filter(function(id){ return ids.indexOf(id)===-1; });
      ['pinnedIds','handIds','handOff','hiddenIds'].forEach(function(k){ if(entry[k]) entry[k] = entry[k].filter(function(id){ return ids.indexOf(id)===-1; }); });
      if(entry.bringOverride) ids.forEach(function(id){ delete entry.bringOverride[id]; });
      if(entry.nameOverride) ids.forEach(function(id){ delete entry.nameOverride[id]; });
    }
    entry.roles = (entry.roles||[]).filter(function(r){ return r!==role; });
  }

  // 検索用の文字の正規化（全角・半角、大文字・小文字、カタカナ・ひらがなの違いを無視）
  function searchNorm(s){
    var t = String(s||'');
    try{ t = t.normalize('NFKC'); }catch(e){}

  }
  // 持ち物マスタの検索：画面を作り直さずに、行の表示・非表示だけを切り替える（入力中の変換を邪魔しない）
  function applyMasterFilter(){

    var words = searchNorm(view.masterQuery||'').replace(/\s+/g,' ').trim();
    var ws = words ? words.split(' ') : [];
    var hit = document.getElementById('master-hit'), guide = document.querySelector('.master-guide');
    list.classList.toggle('searching', ws.length>0);

    list.querySelectorAll('.mg').forEach(function(g){

        var k = r.getAttribute('data-skey') || '';

      });

    });
    if(hit){
      hit.style.display = ws.length ? '' : 'none';
      hit.textContent = ws.length ? (total ? '「'+(view.masterQuery||'').trim()+'」に合う持ち物：'+total+'件' : '「'+(view.masterQuery||'').trim()+'」に合う持ち物は、まだありません') : '';
    }
    if(guide) guide.style.display = ws.length ? 'none' : '';
  }

  function itemsForEntry(mode, entry){

  // パートごとの小見出し用グルーピング（共通 → パート順）
  function groupItemsByRole(items){

    items.forEach(function(it){
      var roles = (it.roles||[]).slice().sort(function(a,b){ return state.roles.indexOf(a)-state.roles.indexOf(b); });
      var key = roles.length ? roles[0] : '';  // ざっくり：先頭（並び順で最初）のパートでまとめる
      if(!groups[key]){ groups[key] = {label: key || '共通', items: [], rank: roles.length ? state.roles.indexOf(roles[0]) : 99999}; order.push(key); }
      groups[key].items.push(it);

    return order.map(function(k){ return groups[k]; }).sort(function(a,b){ return a.rank-b.rank; });
  }

  // ---------- 日付の状態（過去／今日／これから） ----------
  function todayStr(){
    var d = new Date();
    function p2(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  }
  function dateStatus(e){
    if(!e || !e.date) return {kind:'none'};
    var t = todayStr();
    if(e.date===t) return {kind:'today', label:'今日'};
    var diff = Math.round((new Date(e.date+'T00:00:00') - new Date(t+'T00:00:00')) / 86400000);
    if(isNaN(diff)) return {kind:'none'};
    if(diff>0) return {kind:'future', label: diff===1 ? '明日' : 'あと'+diff+'日'};
    return {kind:'past', label:'終了'};
  }
  function statusBadge(st){

  var SORT_KEY = 'gp-sort-v1';

  // 日付順：今日 → これから（近い順）→ 日付未設定 → 過去（新しい順）
  function compareEntries(a, b){
    if(sortMode==='updated') return (b.updatedAt||0) - (a.updatedAt||0);
    var rank = {today:0, future:1, none:2, past:3};
    var sa = dateStatus(a).kind, sb = dateStatus(b).kind;
    if(rank[sa]!==rank[sb]) return rank[sa]-rank[sb];
    if(sa==='none') return (b.updatedAt||0) - (a.updatedAt||0);
    var ka = (a.date||'')+' '+(a.time||'99:99'), kb = (b.date||'')+' '+(b.time||'99:99');
    if(ka===kb) return (b.updatedAt||0) - (a.updatedAt||0);
    var asc = ka < kb ? -1 : 1;
    return sa==='past' ? -asc : asc;
  }

  // ---------- 持ち物チェックのメーター ----------
  function meterColor(pct){
    if(pct>=100) return '#2e9e6b';

    if(pct>=34) return 'var(--amber)';
    return 'var(--red)';
  }
  // ---------- 「渡す」持ち物（持っていって人に渡す／返すもの） ----------
  // entry.handIds：この予定で「渡す」にした持ち物。渡した印は checks の 'h:'+id に保存（チェックのリセットで一緒に消える）
  // item.hand：持ち物マスタでの初期状態が「渡す」。予定ごとに entry.handOff で外せる。
  function isHandMaster(it){ return !!(it && it.hand && isBring(it)); }
  function isHandForEntry(it, entry){
    if(!entry || !isBringForEntry(it, entry)) return false;
    if(entry.handOff && entry.handOff.indexOf(it.id)!==-1) return false;
    if(entry.handIds && entry.handIds.indexOf(it.id)!==-1) return true;
    return !!it.hand;
  }
  function setHandForEntry(entry, it, on){
    if(!entry.handIds) entry.handIds = [];
    if(!entry.handOff) entry.handOff = [];
    entry.handIds = entry.handIds.filter(function(id){ return id!==it.id; });
    entry.handOff = entry.handOff.filter(function(id){ return id!==it.id; });
    if(on && !it.hand) entry.handIds.push(it.id);
    if(!on && it.hand) entry.handOff.push(it.id);
  }
  function handedKey(id){ return 'h:'+id; }
  function handProgress(mode, entry){
    var ck = state.checks[checkKey(mode, entry.id)] || {};
    var items = itemsForEntry(mode, entry).filter(function(it){ return isHandForEntry(it, entry) && !isHiddenForEntry(it, entry); });
    var done = items.filter(function(it){ return ck[handedKey(it.id)]; }).length;
    return {done:done, total:items.length};
  }
  function bringLabel(it, entry){
    if(entry ? isHandForEntry(it, entry) : isHandMaster(it)) return {text:'渡す', style:'color:#7a5ea8;border-color:#7a5ea8;'};
    if(isBringForEntry(it, entry)) return {text:'持込', style:''};
    return {text:'レンタル', style:'color:var(--amber);border-color:var(--amber);'};
  }

  function renderMeter(done, total, hand){
    var pct = total ? Math.round(done/total*100) : 0;
    var complete = total>0 && done>=total;
    var msg = complete ? '準備完了！忘れ物ゼロ 🎉' : (pct>=67 ? 'あと少し！' : (pct>=34 ? 'いい調子' : (done>0 ? 'スタート！' : 'チェックしていこう')));
    var h = '<div class="meter'+(complete?' complete':'')+'">';
    h += '<div class="meter-top"><span class="meter-msg">'+esc(msg)+'</span><span class="meter-num"><b>'+done+'</b> / '+total+'（'+pct+'%）'+(hand && hand.total ? '<span class="meter-hand'+(hand.done>=hand.total?' ok':'')+'">渡す '+hand.done+'/'+hand.total+'</span>' : '')+'</span></div>';
    h += '<div class="meter-track"><div class="meter-fill" style="width:'+pct+'%;background:'+meterColor(pct)+';"></div></div>';

  // 持ち物の進捗カード（「チェックしていこう」など）を出すかどうか。設定の「表示設定」で切り替え（このブラウザだけの設定）
  var SHOW_METER_KEY = 'gp-show-meter-v1';

  function durationMin(t1, t2){
    if(!t1 || !t2) return 0;
    var a = t1.split(':'), b = t2.split(':');
    var m = (parseInt(b[0],10)*60+parseInt(b[1],10)) - (parseInt(a[0],10)*60+parseInt(a[1],10));
    if(isNaN(m)) return 0;
    if(m<=0) m += 24*60;

  function checkKey(mode, entryId){ return mode+':'+entryId; }

  function dowShort(dateStr){

  // 今どこで開いているか（データはこの「場所」ごとに別々に保存される）
  function isStandaloneApp(){ return !!(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }
  function currentPlaceLabel(){
    var ua = navigator.userAgent || '';
    var dev = /iPhone/.test(ua) ? 'iPhone' : (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'この端末';

  // 感想フォームに自動で付ける端末・ブラウザの情報（例：iPhone iOS 18.1 / Safari 18.1 / ホーム画面のアプリ / 画面 390×844）
  function feedbackDeviceInfo(){
    var ua = navigator.userAgent || '';
    var m, dev, os = '';
    if(/iPhone/.test(ua)) dev = 'iPhone';
    else if(/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) dev = 'iPad';
    else if(/Android/.test(ua)) dev = 'Android';
    else if(/Macintosh/.test(ua)) dev = 'Mac';
    else if(/Windows/.test(ua)) dev = 'Windows';
    else if(/Linux/.test(ua)) dev = 'Linux';
    else dev = 'その他';
    if((m = /OS (\d+)[_.](\d+)(?:[_.](\d+))? like Mac OS X/.exec(ua))) os = (dev==='iPad'?'iPadOS ':'iOS ')+m[1]+'.'+m[2]+(m[3]?'.'+m[3]:'');
    else if((m = /Android (\d+(?:\.\d+)*)/.exec(ua))) os = 'Android '+m[1];
    else if((m = /Mac OS X (\d+)[_.](\d+)/.exec(ua))) os = 'macOS '+m[1]+'.'+m[2];
    else if(/Windows NT 10/.test(ua)) os = 'Windows 10/11';
    var br = 'ブラウザ不明', v;
    if((m = /EdgA?\/(\d+)/.exec(ua))) br = 'Edge '+m[1];
    else if((m = /(?:CriOS|Chrome)\/(\d+)/.exec(ua))) br = ((navigator.brave && navigator.brave.isBrave) ? 'Brave ' : 'Chrome ')+m[1];
    else if((m = /(?:FxiOS|Firefox)\/(\d+)/.exec(ua))) br = 'Firefox '+m[1];
    else if((m = /Version\/(\d+(?:\.\d+)?).*Safari\//.exec(ua))) br = 'Safari '+m[1];
    else if(/Safari\//.test(ua)) br = 'Safari';
    var parts = [(os && os.indexOf(dev)===0) ? os : (dev + (os ? ' '+os : '')), br];
    if(isStandaloneApp()) parts.push('ホーム画面のアプリ');
    try{ parts.push('画面 '+Math.round(window.innerWidth)+'×'+Math.round(window.innerHeight)); }catch(e){}

  }
  function feedbackUrl(){

  // ファイル名用の短い環境名（例：iPhone-Safari／iPhone-HomeApp／Mac-Chrome）
  function placeSlug(){

    var dev = /iPhone/.test(ua) ? 'iPhone' : (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'PC';
    if(isStandaloneApp()) return dev+'-HomeApp';
    var br = /EdgA?\//.test(ua) ? 'Edge' : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /FxiOS|Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';

  function describeFileName(name){

  // 画面に出す文字は必ずここを通す（< > & " ' を無害な表記に変える）。属性値の中に入れても安全。
  function esc(s){
    return String(s==null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // ---------- CSV ----------
  function csvEscape(s){
    s = String(s==null?'':s);
    // Excel等で開いたときに「=」「+」「-」「@」で始まる値が数式として実行されないよう、先頭に ' を付ける（取込時に外す）
    if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;

  function entryToCSV(mode, entry){
    var items = itemsForEntry(mode, entry);
    var ck = state.checks[checkKey(mode, entry.id)] || {};
    var rows = [['name','roles','scope','bring','checked']];
    items.forEach(function(it){
      rows.push([

        (it.roles||[]).join(';'),

        (isHandForEntry(it, entry)?'hand':(isBringForEntry(it, entry)?'yes':'no')),
        (ck[it.id]?'true':'false')

  // CSVから「全持ち物の取り込み計画」を作る(この時点ではまだ何も変更しない)。
  // 名前が一致する持ち物は更新、新しい名前は新規作成、CSVに無い名前は削除対象になる。
  function planItemsImport(csvText){
    var rows = parseCSV(csvText);
    var header = rows.length ? rows[0].map(function(h){ return h.trim().toLowerCase(); }) : [];
    var isFull = rows.length>0 && rows[0].length>1 && header.indexOf('name')!==-1;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    var scopeIdx = isFull ? header.indexOf('scope') : -1;
    var rolesIdx = isFull ? header.indexOf('roles') : -1;
    var bringIdx = isFull ? header.indexOf('bring') : -1;
    var dataRows = isFull ? rows.slice(1) : rows;

    var parsed = [];
    var seenNames = {};
    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name || seenNames[name]) return;
      seenNames[name] = true;
      var scopeField = scopeIdx!==-1 && row[scopeIdx] ? row[scopeIdx].split(';').map(function(s){return s.trim();}).filter(function(s){ return MODES.indexOf(s)!==-1; }) : ['studio','live','recording'];
      if(scopeField.length===0) scopeField = ['studio','live','recording'];
      var rolesField = rolesIdx!==-1 && row[rolesIdx] ? row[rolesIdx].split(';').map(function(s){return s.trim();}).filter(Boolean) : [];
      var bringVal = bringIdx!==-1 ? (row[bringIdx]||'').trim().toLowerCase() : 'yes';
      var bringBool = !(bringVal==='no' || bringVal==='rental' || bringVal==='false');
      parsed.push({name:name, scope:scopeField, roles:rolesField, bring:bringBool, hand:(bringVal==='hand')});
    });

    var updated = 0, created = 0, updatedNames = [], createdNames = [];
    parsed.forEach(function(p){
      if(masterItems().some(function(it){ return it.name===p.name; })){ updated++; updatedNames.push(p.name); } else { created++; createdNames.push(p.name); }
    });
    var removedItems = masterItems().filter(function(it){ return !seenNames[it.name]; });

    var newRoles = [];
    parsed.forEach(function(p){
      p.roles.forEach(function(r){
        if(state.roles.indexOf(r)===-1 && newRoles.indexOf(r)===-1) newRoles.push(r);
      });
    });

    var looksEntry = isFull && header.indexOf('checked')!==-1;  // イベントのCSV出力の形式
    return {parsed:parsed, updated:updated, created:created, updatedNames:updatedNames, createdNames:createdNames, removedItems:removedItems, newRoles:newRoles, looksEntry:looksEntry};
  }

  function applyItemsImportPlan(plan){
    if(plan.newRoles && plan.newRoles.length){
      plan.newRoles.forEach(function(r){
        if(state.roles.indexOf(r)===-1) state.roles.push(r);
      });
    }
    plan.parsed.forEach(function(p){
      var existing = masterItems().filter(function(it){ return it.name===p.name; })[0];
      if(existing){
        existing.scope = p.scope;
        existing.roles = p.roles;
        existing.bring = p.bring;
        if(p.hand) existing.hand = true; else delete existing.hand;
      } else {
        var ni = {id:uid(), name:p.name, scope:p.scope, roles:p.roles, bring:p.bring};
        if(p.hand) ni.hand = true;
        state.items.push(ni);
      }
    });
    var toRemoveIds = plan.removedItems.map(function(it){ return it.id; });
    if(toRemoveIds.length){
      state.items = state.items.filter(function(it){ return toRemoveIds.indexOf(it.id)===-1; });
      var allEntries = state.studios.concat(state.lives, state.recordings);
      allEntries.forEach(function(e){
        e.itemIds = e.itemIds.filter(function(id){ return toRemoveIds.indexOf(id)===-1; });
        if(e.bringOverride){ toRemoveIds.forEach(function(id){ delete e.bringOverride[id]; }); }
        if(e.nameOverride){ toRemoveIds.forEach(function(id){ delete e.nameOverride[id]; }); }
        if(e.hiddenIds){ e.hiddenIds = e.hiddenIds.filter(function(id){ return toRemoveIds.indexOf(id)===-1; }); }
      });
      MODES.forEach(function(mode){
        listForMode(mode).forEach(function(e){
          var key = checkKey(mode, e.id);
          if(state.checks[key]){
            toRemoveIds.forEach(function(id){ delete state.checks[key][id]; });
          }
        });
      });
    }
  }

  function parseCSVLine(line){
    var result = [];
    var cur = '';
    var inQuotes = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(inQuotes){
        if(c === '"'){
          if(line[i+1] === '"'){ cur+='"'; i++; }
          else { inQuotes=false; }
        } else { cur+=c; }
      } else {
        if(c === '"'){ inQuotes=true; }
        else if(c === ','){ result.push(cur); cur=''; }
        else { cur+=c; }
      }
    }
    result.push(cur);
    return result;
  }

  function parseCSV(text){
    text = String(text||'').slice(0, MAX_IMPORT_BYTES);           // 巨大ファイル対策
    var lines = text.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length>0; }).slice(0, MAX_LIST);
    return lines.map(function(l){
      return parseCSVLine(l).slice(0, 20).map(function(cell){
        cell = cleanText(cell, MAX_TEXT);                          // 制御文字の除去と長さ制限
        if(/^'[=+\-@]/.test(cell)) cell = cell.slice(1);          // 書き出し時に付けた ' を外す
        return cell;
      });
    });
  }

  // イベントCSV取込の事前確認用
  function planEntryImport(mode, entry, csvText){
    var rows = parseCSV(csvText);
    var plan = {entryId: entry.id, mode: mode, text: csvText, already: [], fromMaster: [], created: [], hasBring: false, hasChecked: false};
    if(rows.length===0) return plan;
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var isFull = rows[0].length>1 && header.indexOf('name')!==-1;
    var dataRows = isFull ? rows.slice(1) : rows;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    plan.hasBring = isFull && header.indexOf('bring')!==-1;
    plan.hasChecked = isFull && header.indexOf('checked')!==-1;
    plan.looksMaster = isFull && !plan.hasChecked && header.indexOf('scope')!==-1 && header.indexOf('roles')!==-1;  // 持ち物マスタ一括出力の形式
    var seen = {};
    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name || seen[name]) return;
      seen[name] = true;
      var item = masterItems().filter(function(it){ return it.name===name; })[0];
      if(!item) plan.created.push(name);
      else if((entry.itemIds||[]).indexOf(item.id)!==-1) plan.already.push(name);
      else plan.fromMaster.push(name);
    });
    return plan;
  }

  function importCSVIntoEntry(mode, entry, csvText){
    var rows = parseCSV(csvText);
    if(rows.length===0) return 0;
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var isFull = rows[0].length>1 && header.indexOf('name')!==-1;
    var dataRows = isFull ? rows.slice(1) : rows;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    var rolesIdx = isFull ? header.indexOf('roles') : -1;
    var scopeIdx = isFull ? header.indexOf('scope') : -1;
    var bringIdx = isFull ? header.indexOf('bring') : -1;
    var checkedIdx = isFull ? header.indexOf('checked') : -1;

    var key = checkKey(mode, entry.id);
    if(!state.checks[key]) state.checks[key] = {};
    var count = 0;

    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name) return;
      var item = masterItems().filter(function(it){ return it.name===name; })[0];
      var isNewItem = !item;
      if(!item){
        var roles = rolesIdx!==-1 && row[rolesIdx] ? row[rolesIdx].split(';').map(function(s){return s.trim();}).filter(Boolean) : [];
        var scopeField = scopeIdx!==-1 && row[scopeIdx] ? row[scopeIdx].split(';').map(function(s){return s.trim();}).filter(function(s){ return MODES.indexOf(s)!==-1; }) : [mode];
        if(scopeField.length===0) scopeField = [mode];
        item = {id:uid(), name:name, scope:scopeField, roles:roles};
        state.items.push(item);
      }
      if(entry.itemIds.indexOf(item.id)===-1) entry.itemIds.push(item.id);
      if(bringIdx!==-1){
        var bringVal = (row[bringIdx]||'').trim().toLowerCase();
        var bringBool = !(bringVal==='no' || bringVal==='rental' || bringVal==='false');
        if(bringVal==='hand'){ setHandForEntry(entry, item, true); }
        else if(item.hand){ setHandForEntry(entry, item, false); }
        if(isNewItem){
          if(!bringBool) item.bring = false;
        } else {
          if(!entry.bringOverride) entry.bringOverride = {};
          entry.bringOverride[item.id] = bringBool;
        }
      }
      if(checkedIdx!==-1){
        var cv = (row[checkedIdx]||'').trim().toLowerCase();
        state.checks[key][item.id] = (cv==='true' || cv==='yes' || cv==='1');
      }
      count++;
    });
    entry.updatedAt = Date.now();
    return count;
  }

  var MAX_IMPORT_BYTES = 5*1024*1024;   // 取り込めるファイルは5MBまで（巨大ファイルでアプリが固まるのを防ぐ）
  function parseBackup(text){
    if(text.length > MAX_IMPORT_BYTES) return {error:'ファイルが大きすぎます（5MBまで）。'};
    var obj;
    try{ obj = JSON.parse(text); }catch(e){ return {error:'バックアップファイルを読み込めませんでした（JSON形式ではありません）。'}; }
    if(!obj || typeof obj!=='object' || obj.app!=='band-mochimono' || !obj.data || typeof obj.data!=='object'){ return {error:'このアプリのバックアップファイルではないようです。'}; }
    var d = obj.data;
    if(!Array.isArray(d.items)){ return {error:'バックアップファイルの中身が壊れているようです。'}; }
    if((d.schemaVersion||1) > SCHEMA_VERSION){ return {error:'新しいバージョンのアプリで作られたバックアップです。アプリを最新にしてから復元してください。'}; }
    var count = function(a){ return Array.isArray(a) ? a.length : 0; };
    return {
      obj: obj,
      exportedAt: cleanText(obj.exportedAt, 40),
      appVersion: cleanText(obj.appVersion, 20),
      place: cleanText(obj.place, 60),
      studios: count(d.studios), lives: count(d.lives), recordings: count(d.recordings),

  function downloadText(filename, text, mime){
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(downloads){
        if(!downloads){ downloadTextPlain(filename, text, mime); return; }
        return downloads.save({filename: filename, data: text}).catch(function(err){
          if(err && err.code === 'declined') return;
          downloadTextPlain(filename, text, mime);
        });
      }).catch(function(){ downloadTextPlain(filename, text, mime); });
      return;
    }
    downloadTextPlain(filename, text, mime);
  }

  function downloadTextPlain(filename, text, mime){
    try{
      var blob = new Blob([text], {type: mime});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){}
  }

  function downloadCSVPlain(filename, csvText){
    try{
      var blob = new Blob(["\uFEFF"+csvText], {type:'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      // Brave(iOS)等は日本語のファイル名がURLエンコードされて表示されるため、日本語を含む場合は英数字名にする
      var dlName = filename;
      if(/[^\x20-\x7E]/.test(dlName)){
        var d = new Date();
        function p2(n){ return (n<10?'0':'')+n; }
        dlName = 'mochimono-' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.csv';
      }
      a.download = dlName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){
      view.csvFallbackText = csvText;
      view.csvFallbackOpen = true;
      render();
    }
  }

  // ---------- render ----------
  // ---------- ヘッダーのヒント文（設定で変更可。空なら初期の文） ----------
  var DEFAULT_TAGLINE = 'パートや予定に合わせて持ち物チェック';
  function currentTagline(){ return (typeof state.tagline==='string' && state.tagline.trim()) ? state.tagline.trim() : DEFAULT_TAGLINE; }
  function applyTagline(){
    var el = document.querySelector('.header p');
    if(el) el.textContent = currentTagline();
  }
  function taglineCountText(){
    var n = Array.from(currentTagline()).length;
    return n+'字'+(n>25 ? '（スマホでは2行になることがあります。目安は25字まで）' : '（多くのスマホで1行に収まります）');
  }

  function render(){
    applyTabOrder();
    applyTagline();
    var pinBar = document.getElementById('pin-bar');
    if(pinBar){
      pinBar.innerHTML = renderPinBar();
      pinBar.querySelectorAll('[data-pin-open]').forEach(function(b){
        b.onclick = function(){
          if(b._swiped) return;   // スワイプ操作の直後は開かない
          var parts = b.dataset.pinOpen.split('|');
          view.mode = parts[0];
          view.selectedByMode[parts[0]] = parts[1];
          view.editMode = false; view.infoOpen = false; view.confirmDeleteEntry = false;
          render();
          window.scrollTo(0, 0);
        };
      });
    }
    document.querySelectorAll('.nav button').forEach(function(b){
      b.classList.toggle('active', b.dataset.mode===view.mode);
    });
    var app = document.getElementById('app');
    document.body.classList.toggle('is-detail', view.mode!=='items' && !!view.selectedByMode[view.mode] && !view.editMode);
    document.body.classList.toggle('is-list', view.mode!=='items' && !view.selectedByMode[view.mode]);
    document.body.classList.toggle('is-settings', view.mode==='items');
    if(view.mode==='items'){
      app.innerHTML = renderItemsView();
      applySettingsAccordion(app);
      if(wideSettings()) applySettingsSideMenu(app); else groupSettingsCards(app);
    } else {
      if(view.selectedByMode[view.mode]){
        app.innerHTML = renderDetailView(view.mode, view.selectedByMode[view.mode]);
      } else {
        app.innerHTML = renderEntryListView(view.mode);
      }
    }
    // バージョンのお知らせは画面の一番上（ヘッダーより上）に出す
    var notice = renderNewVersionBar() + renderUpdateNotice();
    var topNotice = document.getElementById('top-notice');
    if(topNotice){ topNotice.innerHTML = notice; }
    document.body.classList.toggle('has-top-notice', !!notice);
    if(notice && !window.__noticeScrolled){
      window.__noticeScrolled = true;
      try{ history.scrollRestoration = 'manual'; }catch(e){}
      window.scrollTo(0,0);
      window.addEventListener('load', function(){ setTimeout(function(){ window.scrollTo(0,0); }, 0); });
    }
    document.querySelectorAll('[data-meter-set]').forEach(function(c){
      c.onclick = function(){
        showMeter = c.dataset.meterSet==='on';
        try{ localStorage.setItem(SHOW_METER_KEY, showMeter?'1':'0'); }catch(e){}
        render();
      };
    });
    var nvReload = document.getElementById('newver-reload-btn');
    if(nvReload){ nvReload.onclick = function(){ hardReload(); }; }
    var shareTa = document.getElementById('share-text');
    if(shareTa){
      shareTa.oninput = function(){ view.shareText = shareTa.value; };
      var shareSend = document.getElementById('share-send-btn');
      if(shareSend) shareSend.onclick = function(){
        var text = shareTa.value;
        if(navigator.share){
          // 本文にURLが入っていれば、そのまま送る（URLが二重にならないように）
          navigator.share({title:'バンドマン持ち物リスト', text:text}).catch(function(err){
            if(err && err.name==='AbortError') return;
            copyTextToClipboard(text, '送れなかったので、文章をコピーしました。LINEなどに貼り付けて送ってください');
          });
        } else {
          copyTextToClipboard(text, 'この端末では直接送れないので、文章をコピーしました。LINEやメールに貼り付けて送ってください');
        }
      };
      var shareCopy = document.getElementById('share-copy-btn');
      if(shareCopy) shareCopy.onclick = function(){ copyTextToClipboard(shareTa.value, '文章をコピーしました'); };
      var shareReset = document.getElementById('share-reset-btn');
      if(shareReset) shareReset.onclick = function(){ view.shareText = null; render(); };
    }
    var updCheckBtn = document.getElementById('update-check-btn');
    if(updCheckBtn){ updCheckBtn.onclick = function(){ manualUpdateCheck(); }; }
    var updNowBtn = document.getElementById('update-now-btn');
    if(updNowBtn){ updNowBtn.onclick = function(){ hardReload(); }; }
    var showHiddenListEl = document.getElementById('show-hidden-list');
    if(showHiddenListEl){
      showHiddenListEl.onchange = function(){
        showHiddenList = showHiddenListEl.checked;
        try{ localStorage.setItem(SHOW_HIDDEN_KEY, showHiddenList?'1':'0'); }catch(e){}
        render();
      };
    }
    document.querySelectorAll('[data-check-filter]').forEach(function(c){
      c.onclick = function(){
        uncheckedOnly = c.dataset.checkFilter==='unchecked';
        try{ localStorage.setItem(UNCHECKED_KEY, uncheckedOnly?'1':'0'); }catch(e){}
        render();
      };
    });
    document.querySelectorAll('[data-sort-mode]').forEach(function(c){
      c.onclick = function(){
        sortMode = c.dataset.sortMode==='updated' ? 'updated' : 'date';
        try{ localStorage.setItem(SORT_KEY, sortMode); }catch(e){}
        render();
      };
    });
    var hidePastToggle = document.getElementById('hide-past-toggle');
    if(hidePastToggle){
      hidePastToggle.onchange = function(){
        hidePast = hidePastToggle.checked;
        try{ localStorage.setItem(HIDE_PAST_KEY, hidePast?'1':'0'); }catch(e){}
        render();
      };
    }
    var regToggle = document.getElementById('reg-toggle-btn');
    if(regToggle){ regToggle.onclick = function(){ var isOpen = regToggle.classList.contains('open'); view.regOpen[view.mode] = isOpen ? 'closed' : true; render(); }; }
    var updClose = document.getElementById('update-close-btn');
    if(updClose){ updClose.onclick = function(){ markVersionSeen(); render(); }; }
    bindEvents();
  }

        html += '</div>';
        html += '<div class="progress">'+p.done+' / '+p.total+'</div>';

      }

    html += '</div>';

  function renderDetailView(mode, entryId){
    var list = listForMode(mode);

    if(!entry){ view.selectedByMode[mode] = null; return renderEntryListView(mode); }

    var locked = !!entry.locked;
    if(locked){ view.editMode = false; view.infoOpen = false; }
    var items = itemsForEntry(mode, entry);
    var bringItems = items.filter(function(it){ return isBringForEntry(it, entry) && !isHiddenForEntry(it, entry); });
    var ck = state.checks[checkKey(mode, entry.id)] || {};
    var done = bringItems.filter(function(it){return ck[it.id];}).length;
    var pct = bringItems.length? Math.round(done/bringItems.length*100) : 0;

    var html = '';
    html += '<div class="backrow"><button class="backbtn" id="back-btn">← '+esc(modeLabel(mode))+'一覧</button>';
    html += '<button class="lock-btn'+(locked?' on':'')+'" id="lock-toggle-btn" aria-pressed="'+(locked?'true':'false')+'" title="'+(locked?'タップでロック解除':'ロックすると編集・削除・チェックができなくなります')+'">'+(locked?'🔒 ロック中':'🔓 ロック')+'</button>';

          var bl = bringLabel(it, entry);
          if(isHandForEntry(it, entry)){

        if(eplan.created.length){ html += '<p class="hint"><b style="color:var(--amber);">新規 '+eplan.created.length+'件</b>（持ち物マスタにも登録されます）：'+namesPreview(eplan.created)+'</p>'; }

      html += '</div></div>';
    } else if(locked){
      html += '<div class="op-row one">';

      html += '</div>';
    } else if(view.confirmDeleteEntry){

        if(cnt) cnt.textContent = taglineCountText();
        if(tagReset) tagReset.disabled = (currentTagline()===DEFAULT_TAGLINE);
      };
      tagInput.onblur = function(){ if(!tagInput.value.trim()){ tagInput.value = DEFAULT_TAGLINE; state.tagline = ''; saveState(); } };

        state.tagline = '';

        render();

      b.onclick = function(){
        view.mode = b.dataset.mode;

        view.newEntryDate = '';
        view.newEntryTime = '';

    function updateSuggest(){
      var box = document.getElementById('custom-item-suggest');
      var entry = currentEntry();
      if(!box || !entry || !customNameEl) return;
      var q = normName(customNameEl.value);
      var btn = customAddBtn;
      if(btn) btn.textContent = '追加';
      if(!q){ box.innerHTML = ''; return; }
      var inEntry = {};
      (entry.itemIds||[]).forEach(function(id){ inEntry[id] = true; });
      var found = [], exact = false;
      state.items.forEach(function(it){
        if(it.local && it.ownerId!==entry.id) return;
        var n = normName(effectiveItemName(it, entry));
        var n2 = normName(it.name);
        var hit = (n && (n.indexOf(q)!==-1 || q.indexOf(n)!==-1)) || (n2 && (n2.indexOf(q)!==-1 || q.indexOf(n2)!==-1));
        if(!hit) return;
        if(n===q || n2===q) exact = true;
        found.push(it);
      });
      if(found.length===0){ box.innerHTML = ''; return; }
      found.sort(function(a,b){ return (inEntry[b.id]?1:0)-(inEntry[a.id]?1:0); });
      var h = '<div class="suggest-note">'+(exact?'同じ名前の持ち物があります。別の持ち物として追加もできます。':'似た持ち物があります。')+'</div>';
      found.slice(0,5).forEach(function(it){
        var here = !!inEntry[it.id];
        h += '<div class="suggest-row"><div class="nm">'+esc(effectiveItemName(it, entry))+'</div>';
        h += '<span class="suggest-tag">'+(it.local ? 'この予定専用' : 'マスタ')+(here?'・追加済み':'')+'</span>';
        if(!here){ h += '<button class="btn ghost" data-suggest-add="'+it.id+'" style="padding:3px 9px;font-size:11px;">これを追加</button>'; }
        h += '</div>';
      });
      box.innerHTML = h;
      if(btn && exact) btn.textContent = '別に追加';
      box.querySelectorAll('[data-suggest-add]').forEach(function(b){
        b.onclick = function(){
          var e2 = currentEntry();
          if(!e2) return;

          e2.updatedAt = Date.now();
          saveState();
          render();
        };
      });
    }

    function closeSwipeRows(except){
      document.querySelectorAll('.swipe-row.swipe-open').forEach(function(r){
        if(r===except) return;
        r.classList.remove('swipe-open'); r.style.transform='';
        setTimeout(function(){ if(r.parentNode && !r.classList.contains('swipe-open')) r.parentNode.classList.remove('sw-on'); }, 200);
      });
    }
    document.querySelectorAll('[data-swipe-row]').forEach(function(row){
      var kind = row.dataset.swipeKind;
      var startX=0, startY=0, dx=0, tracking=false, moved=false, pid=null, wasOpen=false, canRight=false;
      var OPEN = 88;
      row.addEventListener('pointerdown', function(ev){
        if(ev.target.closest('button')) return;
        wasOpen = row.classList.contains('swipe-open');
        closeSwipeRows(row);
        tracking=true; moved=false; dx=0; startX=ev.clientX; startY=ev.clientY; pid=ev.pointerId;
        // 画面左端からのスワイプは、iPhoneの「戻る」操作と重なるので右スワイプとして扱わない
        canRight = !!row.dataset.swipeRight && ev.clientX > 28;
      });
      row.addEventListener('pointermove', function(ev){
        if(!tracking || ev.pointerId!==pid) return;
        var mx = ev.clientX-startX, my = ev.clientY-startY;
        if(!moved){
          if(Math.abs(mx)<10) return;
          if(Math.abs(my)>Math.abs(mx)){ tracking=false; return; }
          moved=true;
          row.parentNode.classList.add('sw-on');
          row.classList.add('swiping');
          try{ row.setPointerCapture(pid); }catch(e){}
        }
        var base = wasOpen ? -OPEN : 0;
        dx = canRight ? Math.min(160, base+mx) : Math.min(0, base+mx);
        row.parentNode.classList.toggle('sw-right', dx>0);
        row.style.transform = 'translateX('+dx+'px)';
      });
      function end(){
        if(!tracking) return;
        tracking=false;
        row.classList.remove('swiping');
        if(moved){
          if(canRight && dx > 90 && row.dataset.swipeRight==='pin-item'){
            row.style.transform='';
            var pe = listForMode(row.dataset.entryMode || view.mode).filter(function(x){ return x.id===row.dataset.entry; })[0];
            if(pe && pe.pinnedIds){ pe.pinnedIds = pe.pinnedIds.filter(function(x){ return x!==row.dataset.itemId; }); saveState(); }
            setTimeout(render, 120);
          } else if(canRight && dx > 90 && row.dataset.swipeRight==='role-hide'){
            row.style.transform='';
            toggleRoleHidden(row.dataset.roleName);
            setTimeout(render, 120);
          } else if(canRight && dx > 90 && row.dataset.swipeRight==='pin-entry'){
            row.style.transform='';
            var ev2 = listForMode(row.dataset.entryMode || view.mode).filter(function(x){ return x.id===row.dataset.entry; })[0];
            if(ev2){ ev2.pinned = !ev2.pinned; saveState(); }   // 並び順が変わらないよう updatedAt は更新しない
            setTimeout(render, 120);
          } else if(canRight && dx > 90){
            row.style.transform='';
            var pid2=row.dataset.swipeRow;
            var entryP=currentEntry();
            if(entryP){
              if(!entryP.pinnedIds) entryP.pinnedIds=[];
              var pi=entryP.pinnedIds.indexOf(pid2);
              if(pi===-1) entryP.pinnedIds.push(pid2); else entryP.pinnedIds.splice(pi,1);
              entryP.updatedAt=Date.now();
              saveState();
            }
            setTimeout(render, 120);
          } else if(kind==='hide' && dx < -90){
            row.style.transform='translateX(-110%)';
            var id=row.dataset.swipeRow;
            setTimeout(function(){
              var entry=currentEntry();
              if(!entry) return;
              if(!entry.hiddenIds) entry.hiddenIds=[];
              if(entry.hiddenIds.indexOf(id)===-1) entry.hiddenIds.push(id);
              entry.updatedAt=Date.now();
              saveState();
              render();
            }, 180);
          } else if(kind==='del' && dx < -OPEN/2){
            row.classList.add('swipe-open');
            row.style.transform='translateX(-'+OPEN+'px)';
          } else {
            row.classList.remove('swipe-open');
            row.style.transform='';
            setTimeout(function(){ if(!row.classList.contains('swipe-open')) row.parentNode.classList.remove('sw-on'); }, 200);
          }
          row._swiped = true;
          setTimeout(function(){ row._swiped=false; }, 350);
        } else if(wasOpen){
          row._swiped = true;
          setTimeout(function(){ row._swiped=false; }, 350);
        }
      }
      row.addEventListener('pointerup', end);
      row.addEventListener('pointercancel', end);
      row.addEventListener('click', function(ev){
        if(row._swiped){ ev.stopPropagation(); ev.preventDefault(); }
      }, true);
    });

        var b = loadBeforeReset();
        var clean = null;
        try{ clean = b ? sanitizeState(b.data) : null; }catch(e){ clean = null; }
        if(!clean){ showToast('初期化前のデータを読み込めませんでした'); render(); return; }
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(clean)); }catch(e){}
        state = loadState();
        saveState();
        try{ localStorage.removeItem(BEFORE_RESET_KEY); }catch(e){}
        MODES.forEach(function(m){ view.selectedByMode[m] = null; });
        view.newEntryRoles = defaultEntryRoles();
        render();
        showToast('↩ 初期化する前のデータに戻しました');
      };
    }
  }

  render();
})();
</script>
</body>
</html>
