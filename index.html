<title>バンドマン持ち物リスト</title>
<style>
  :root{
    --bg:#1c1b19;
    --panel:#242220;
    --panel-raised:#2c2925;
    --seam:#3a352e;
    --cream:#eee6d6;
    --cream-dim:#a89f8d;
    --amber:#e8a23c;
    --amber-dim:#8a6226;
    --teal:#4f8c85;
    --teal-dim:#2f524d;
    --red:#c1543c;
    --radius:10px;
    --field-bg:#1a1917;
    --nav-bg:#161513;
    --placeholder:#6d6558;
    --header-g1:#231f1c;
    --header-g2:#1c1b19;
  }
  :root[data-theme="light"]{
    --bg:#f6f1e7;
    --panel:#ffffff;
    --panel-raised:#f1ead9;
    --seam:#ddd2ba;
    --cream:#2a2520;
    --cream-dim:#8a8070;
    --amber:#c97f1e;
    --amber-dim:#f1dba8;
    --teal:#3f726c;
    --teal-dim:#dcebe8;
    --red:#b23b26;
    --field-bg:#ffffff;
    --nav-bg:#efe6d2;
    --placeholder:#b4a98e;
    --header-g1:#efe6d2;
    --header-g2:#f6f1e7;
  }
  :root{color-scheme:dark;--font-jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo","Yu Gothic UI","Yu Gothic",YuGothic,sans-serif;}
  /* フォームやボタンもページと同じフォントに（Windowsで明朝体・小さい文字になるのを防ぐ） */
  button,input,select,textarea{font-family:inherit;}
  button{font-size:inherit;}
  /* PC（マウス操作・広い画面）では全体を少し大きく */
  @media (min-width:640px) and (pointer:fine){ html{zoom:1.15;} }
  /* 広い画面では、ヘッダーとタブも本文と同じ幅に揃える */
  @media (min-width:560px){ html .nav,html .header{padding-left:calc(50% - 224px);padding-right:calc(50% - 224px);} html .header .led{right:calc(50% - 216px);} }
  :root[data-theme="light"]{color-scheme:only light;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html{background:var(--bg);}
  img,svg,textarea,select,input{max-width:100%;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:var(--font-jp);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  h1,h2,h3{
    font-family:'Oswald',var(--font-jp);
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
  }
  .header{
    padding:calc(22px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 16px max(18px, env(safe-area-inset-left, 0px));
    background:linear-gradient(180deg,var(--header-g1),var(--header-g2));
    border-bottom:1px solid var(--seam);
    position:relative;
  }
  .header .led{
    position:absolute;
    top:24px; right:20px;
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 6px 1px rgba(232,162,60,.7);
  }
  .header h1{font-size:19px;color:var(--cream);}
  .header p{margin:4px 0 0;font-size:12.5px;color:var(--cream-dim);}

  .container{width:100%;max-width:480px;margin:0 auto;padding:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}

  .panel{
    background:var(--panel);
    border:1px solid var(--seam);
    border-radius:var(--radius);
    padding:14px 14px 16px;
    margin-bottom:14px;
    overflow-x:hidden;
  }
  .panel-label{
    font-family:'Oswald',var(--font-jp);
    font-size:11px;
    letter-spacing:.08em;
    color:var(--amber);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .panel-label::before{
    content:'';
    width:5px;height:5px;border-radius:50%;
    background:var(--amber);
  }

  /* nav footswitches (under the header now) */
  .nav{
    display:flex;
    background:var(--nav-bg);
    border-bottom:1px solid var(--seam);
    padding:10px 10px;
    gap:8px;
  }
  .nav button{
    flex:1;
    background:var(--panel-raised);
    border:1px solid var(--seam);
    border-radius:8px;
    color:var(--cream-dim);
    font-family:'Oswald',var(--font-jp);
    font-size:11.5px;
    letter-spacing:.02em;
    padding:10px 2px;
    cursor:pointer;
  }
  .nav button.active{
    color:#1c1b19;
    background:var(--amber);
    border-color:var(--amber);
  }

  /* form controls */
  input[type=text],input[type=date],input[type=time],select,textarea{
    width:100%;
    background:var(--field-bg);
    border:1px solid var(--seam);
    color:var(--cream);
    border-radius:7px;
    padding:9px 10px;
    font-size:14.5px;
    margin-bottom:8px;
  }
  input[type=date],input[type=time]{
    -webkit-appearance:none;
    appearance:none;
    min-width:0;
    display:block;
    height:38px;
    line-height:1.2;
    padding-left:6px;padding-right:6px;font-size:14px;
  }
  input,select,textarea,button{color-scheme:inherit;}
  :root[data-theme="light"] input[type=date],:root[data-theme="light"] input[type=time]{color-scheme:light;}
  input[type=text]::placeholder{color:var(--placeholder);}
  label.small{font-size:12px;color:var(--cream-dim);display:block;margin-bottom:4px;}

  .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{
    font-size:11.5px;
    padding:6px 12px;
    border-radius:99px;
    border:1px solid var(--seam);
    color:var(--cream-dim);
    background:var(--field-bg);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.on{
    background:var(--teal-dim);
    border-color:var(--teal);
    color:var(--cream);
  }
  .chip .x{margin-left:6px;color:var(--red);}
  .chip.static{cursor:default;}

  .btn{
    background:var(--amber-dim);
    border:1px solid var(--amber);
    color:var(--cream);
    border-radius:7px;
    padding:9px 14px;
    font-size:13.5px;
    font-family:'Oswald',var(--font-jp);
    letter-spacing:.02em;
    cursor:pointer;
    display:inline-block;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid var(--seam);
    color:var(--cream-dim);
  }
  .btn.danger{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
  }
  .btn.block{width:100%;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn:disabled:active{transform:none;}

  /* item rows */
  .item-row{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--seam);
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{font-size:14px;}
  .item-meta{font-size:11px;color:var(--cream-dim);margin-top:2px;}
  .del-x{
    color:var(--red);
    font-size:16px;
    padding:2px 8px;
    cursor:pointer;
    background:none;border:none;
  }

  /* entry cards (studio/live list) */
  .entry-card{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-raised);
    border:1px solid var(--seam);
    border-radius:8px;
    padding:12px 12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .entry-card .name{font-size:15px;font-weight:600;font-family:'Oswald',var(--font-jp);}
  .entry-card .progress{font-size:12px;color:var(--amber);white-space:nowrap;margin-left:10px;}

  .empty{
    text-align:center;
    color:var(--cream-dim);
    font-size:13px;
    padding:24px 8px;
  }

  /* checklist */
  .check-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 2px;
    border-bottom:1px solid var(--seam);
  }
  .check-row:last-child{border-bottom:none;}
  .group-head{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--amber);letter-spacing:.04em;padding:10px 2px 4px;border-bottom:1px solid var(--seam);}
  .group-head:first-child{padding-top:2px;}
  .group-toggle{width:100%;background:none;border:none;border-bottom:1px solid var(--seam);font-family:inherit;text-align:left;cursor:pointer;padding:12px 2px;font-size:13px;}
  .group-toggle .group-chev{margin-left:auto;color:var(--cream-dim);display:flex;transition:transform .18s;}
  .group-toggle.open .group-chev{transform:rotate(180deg);}
  .group-count{font-size:10.5px;font-weight:400;color:var(--cream-dim);}
  .suggest{margin-top:8px;}
  .suggest-row{display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--seam);font-size:13.5px;}
  .suggest-row .nm{flex:1;min-width:0;}
  .suggest-tag{font-size:10.5px;color:var(--cream-dim);border:1px solid var(--seam);border-radius:4px;padding:0 5px;white-space:nowrap;}
  .suggest-note{font-size:11.5px;color:var(--amber);margin-bottom:2px;}
  .op-label{font-size:11px;color:var(--cream-dim);margin:14px 2px 6px;letter-spacing:.04em;}
  .op-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px;}
  .op-row.two{grid-template-columns:1fr 1fr;}
  .op-row .btn{padding:9px 4px;font-size:12.5px;white-space:nowrap;min-width:0;width:100%;}

  // 用途(該当モードを含むか)が合う持ち物のうち、
  // ・パートを何も選ばなかった場合 → とりあえず全部入れる
  // ・パートを選んだ場合 → 共通アイテム + そのパートに該当するアイテムだけを自動採用
  // あとは詳細画面の「持ち物を編集」で自由に増減できる。
  function computeAutoItemIds(mode, entryRoles, itemsList){
    var src = itemsList || state.items;
    return src.filter(function(it){
      if(it.local) return false;
      var scopeOk = it.scope && it.scope.indexOf(mode)!==-1;
      if(!scopeOk) return false;
      if(!entryRoles || entryRoles.length===0) return true;
      if(!it.roles || it.roles.length===0) return true;
      return it.roles.some(function(r){ return entryRoles.indexOf(r)!==-1; });
    }).map(function(it){ return it.id; });
  }

  function migrateScope(scope){
    if(Array.isArray(scope)) return scope;
    if(scope==='both') return ['studio','live','recording'];
    if(scope==='studio') return ['studio'];
    if(scope==='live') return ['live'];
    return ['studio','live','recording'];
  }

  function migrateEntry(mode, e){
    if(!e.itemIds){
      e.itemIds = computeAutoItemIds(mode);

    if(!e.updatedAt) e.updatedAt = 0;

  function loadState(){

      if(!parsed.studios) parsed.studios = [];
      if(!parsed.lives) parsed.lives = [];
      if(!parsed.recordings) parsed.recordings = [];
      if(!parsed.roles) parsed.roles = defaultRoles();
      if(!parsed.schemaVersion) parsed.schemaVersion = 1;  // 形式1：v1.0〜（将来、形式を変えるときはここで変換する）
      parsed.items.forEach(function(it){ delete it.tags; if(!it.roles) it.roles = []; it.scope = migrateScope(it.scope); });
      state = parsed;
      parsed.studios.forEach(function(e){ migrateEntry('studio', e); });
      parsed.lives.forEach(function(e){ migrateEntry('live', e); });
      parsed.recordings.forEach(function(e){ migrateEntry('recording', e); });

  function todayStr(){

  function dateStatus(e){
    if(!e || !e.date) return {kind:'none'};
    var t = todayStr();

    var diff = Math.round((new Date(e.date+'T00:00:00') - new Date(t+'T00:00:00')) / 86400000);
    if(isNaN(diff)) return {kind:'none'};
    if(diff>0) return {kind:'future', label: diff===1 ? '明日' : 'あと'+diff+'日'};
    return {kind:'past', label:'終了'};
  }

  // 日付順：今日 → これから（近い順）→ 日付未設定 → 過去（新しい順）
  function compareEntries(a, b){
    if(sortMode==='updated') return (b.updatedAt||0) - (a.updatedAt||0);
    var rank = {today:0, future:1, none:2, past:3};
    var sa = dateStatus(a).kind, sb = dateStatus(b).kind;
    if(rank[sa]!==rank[sb]) return rank[sa]-rank[sb];
    if(sa==='none') return (b.updatedAt||0) - (a.updatedAt||0);
    var ka = (a.date||'')+' '+(a.time||'99:99'), kb = (b.date||'')+' '+(b.time||'99:99');
    if(ka===kb) return (b.updatedAt||0) - (a.updatedAt||0);
    var asc = ka < kb ? -1 : 1;
    return sa==='past' ? -asc : asc;
  }

  // CSVから「全持ち物の取り込み計画」を作る(この時点ではまだ何も変更しない)。
  // 名前が一致する持ち物は更新、新しい名前は新規作成、CSVに無い名前は削除対象になる。
  function planItemsImport(csvText){
    var rows = parseCSV(csvText);
    var header = rows.length ? rows[0].map(function(h){ return h.trim().toLowerCase(); }) : [];
    var isFull = rows.length>0 && rows[0].length>1 && header.indexOf('name')!==-1;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    var scopeIdx = isFull ? header.indexOf('scope') : -1;
    var rolesIdx = isFull ? header.indexOf('roles') : -1;
    var bringIdx = isFull ? header.indexOf('bring') : -1;
    var dataRows = isFull ? rows.slice(1) : rows;

    var parsed = [];
    var seenNames = {};
    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name || seenNames[name]) return;
      seenNames[name] = true;
      var scopeField = scopeIdx!==-1 && row[scopeIdx] ? row[scopeIdx].split(';').map(function(s){return s.trim();}).filter(function(s){ return MODES.indexOf(s)!==-1; }) : ['studio','live','recording'];
      if(scopeField.length===0) scopeField = ['studio','live','recording'];
      var rolesField = rolesIdx!==-1 && row[rolesIdx] ? row[rolesIdx].split(';').map(function(s){return s.trim();}).filter(Boolean) : [];
      var bringVal = bringIdx!==-1 ? (row[bringIdx]||'').trim().toLowerCase() : 'yes';
      var bringBool = !(bringVal==='no' || bringVal==='rental' || bringVal==='false');
      parsed.push({name:name, scope:scopeField, roles:rolesField, bring:bringBool});
    });

    var updated = 0, created = 0;
    parsed.forEach(function(p){
      if(masterItems().some(function(it){ return it.name===p.name; })) updated++; else created++;
    });
    var removedItems = masterItems().filter(function(it){ return !seenNames[it.name]; });

    var newRoles = [];
    parsed.forEach(function(p){
      p.roles.forEach(function(r){
        if(state.roles.indexOf(r)===-1 && newRoles.indexOf(r)===-1) newRoles.push(r);
      });
    });

    var looksEntry = isFull && header.indexOf('checked')!==-1;  // イベントのCSV出力の形式
    return {parsed:parsed, updated:updated, created:created, removedItems:removedItems, newRoles:newRoles, looksEntry:looksEntry};
  }

  function applyItemsImportPlan(plan){
    if(plan.newRoles && plan.newRoles.length){
      plan.newRoles.forEach(function(r){
        if(state.roles.indexOf(r)===-1) state.roles.push(r);
      });
    }
    plan.parsed.forEach(function(p){
      var existing = masterItems().filter(function(it){ return it.name===p.name; })[0];
      if(existing){
        existing.scope = p.scope;
        existing.roles = p.roles;
        existing.bring = p.bring;
      } else {
        state.items.push({id:uid(), name:p.name, scope:p.scope, roles:p.roles, bring:p.bring});
      }
    });
    var toRemoveIds = plan.removedItems.map(function(it){ return it.id; });
    if(toRemoveIds.length){
      state.items = state.items.filter(function(it){ return toRemoveIds.indexOf(it.id)===-1; });
      var allEntries = state.studios.concat(state.lives, state.recordings);
      allEntries.forEach(function(e){
        e.itemIds = e.itemIds.filter(function(id){ return toRemoveIds.indexOf(id)===-1; });
        if(e.bringOverride){ toRemoveIds.forEach(function(id){ delete e.bringOverride[id]; }); }
        if(e.nameOverride){ toRemoveIds.forEach(function(id){ delete e.nameOverride[id]; }); }
        if(e.hiddenIds){ e.hiddenIds = e.hiddenIds.filter(function(id){ return toRemoveIds.indexOf(id)===-1; }); }
      });
      MODES.forEach(function(mode){
        listForMode(mode).forEach(function(e){
          var key = checkKey(mode, e.id);
          if(state.checks[key]){
            toRemoveIds.forEach(function(id){ delete state.checks[key][id]; });
          }
        });
      });
    }
  }

  function parseCSVLine(line){
    var result = [];
    var cur = '';
    var inQuotes = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(inQuotes){
        if(c === '"'){
          if(line[i+1] === '"'){ cur+='"'; i++; }
          else { inQuotes=false; }
        } else { cur+=c; }
      } else {
        if(c === '"'){ inQuotes=true; }
        else if(c === ','){ result.push(cur); cur=''; }
        else { cur+=c; }
      }
    }
    result.push(cur);
    return result;
  }

  function parseCSV(text){
    var lines = text.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length>0; });
    return lines.map(parseCSVLine);
  }

  // イベントCSV取込の事前確認用
  function planEntryImport(mode, entry, csvText){
    var rows = parseCSV(csvText);
    var plan = {entryId: entry.id, mode: mode, text: csvText, already: [], fromMaster: [], created: [], hasBring: false, hasChecked: false};
    if(rows.length===0) return plan;
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var isFull = rows[0].length>1 && header.indexOf('name')!==-1;
    var dataRows = isFull ? rows.slice(1) : rows;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    plan.hasBring = isFull && header.indexOf('bring')!==-1;
    plan.hasChecked = isFull && header.indexOf('checked')!==-1;
    plan.looksMaster = isFull && !plan.hasChecked && header.indexOf('scope')!==-1 && header.indexOf('roles')!==-1;  // 持ち物マスタ一括出力の形式
    var seen = {};
    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name || seen[name]) return;
      seen[name] = true;
      var item = masterItems().filter(function(it){ return it.name===name; })[0];
      if(!item) plan.created.push(name);
      else if((entry.itemIds||[]).indexOf(item.id)!==-1) plan.already.push(name);
      else plan.fromMaster.push(name);
    });
    return plan;
  }

  function importCSVIntoEntry(mode, entry, csvText){
    var rows = parseCSV(csvText);
    if(rows.length===0) return 0;
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var isFull = rows[0].length>1 && header.indexOf('name')!==-1;
    var dataRows = isFull ? rows.slice(1) : rows;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    var rolesIdx = isFull ? header.indexOf('roles') : -1;
    var scopeIdx = isFull ? header.indexOf('scope') : -1;
    var bringIdx = isFull ? header.indexOf('bring') : -1;
    var checkedIdx = isFull ? header.indexOf('checked') : -1;

    var key = checkKey(mode, entry.id);
    if(!state.checks[key]) state.checks[key] = {};
    var count = 0;

    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name) return;
      var item = masterItems().filter(function(it){ return it.name===name; })[0];
      var isNewItem = !item;
      if(!item){
        var roles = rolesIdx!==-1 && row[rolesIdx] ? row[rolesIdx].split(';').map(function(s){return s.trim();}).filter(Boolean) : [];
        var scopeField = scopeIdx!==-1 && row[scopeIdx] ? row[scopeIdx].split(';').map(function(s){return s.trim();}).filter(function(s){ return MODES.indexOf(s)!==-1; }) : [mode];
        if(scopeField.length===0) scopeField = [mode];
        item = {id:uid(), name:name, scope:scopeField, roles:roles};
        state.items.push(item);
      }
      if(entry.itemIds.indexOf(item.id)===-1) entry.itemIds.push(item.id);
      if(bringIdx!==-1){
        var bringVal = (row[bringIdx]||'').trim().toLowerCase();
        var bringBool = !(bringVal==='no' || bringVal==='rental' || bringVal==='false');
        if(isNewItem){
          if(!bringBool) item.bring = false;
        } else {
          if(!entry.bringOverride) entry.bringOverride = {};
          entry.bringOverride[item.id] = bringBool;
        }
      }
      if(checkedIdx!==-1){
        var cv = (row[checkedIdx]||'').trim().toLowerCase();
        state.checks[key][item.id] = (cv==='true' || cv==='yes' || cv==='1');
      }
      count++;
    });
    entry.updatedAt = Date.now();
    return count;
  }

  function tsName(prefix, ext){

  function buildBackup(){

    return JSON.stringify({
      app: 'band-mochimono',
      format: 1,

      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      place: currentPlaceLabel(),

      data: state
    }, null, 1);

  function parseBackup(text){
    var obj;
    try{ obj = JSON.parse(text); }catch(e){ return {error:'バックアップファイルを読み込めませんでした（JSON形式ではありません）。'}; }
    if(!obj || obj.app!=='band-mochimono' || !obj.data){ return {error:'このアプリのバックアップファイルではないようです。'}; }
    var d = obj.data;
    if(!Array.isArray(d.items)){ return {error:'バックアップファイルの中身が壊れているようです。'}; }
    if((d.schemaVersion||1) > SCHEMA_VERSION){ return {error:'新しいバージョンのアプリで作られたバックアップです。アプリを最新にしてから復元してください。'}; }
    var count = function(a){ return Array.isArray(a) ? a.length : 0; };
    return {
      obj: obj,
      exportedAt: obj.exportedAt || '',
      appVersion: obj.appVersion || '',
      place: obj.place || '',
      studios: count(d.studios), lives: count(d.lives), recordings: count(d.recordings),
      items: d.items.filter(function(it){ return !it.local; }).length
    };
  }

  function downloadText(filename, text, mime){
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(downloads){
        if(!downloads){ downloadTextPlain(filename, text, mime); return; }
        return downloads.save({filename: filename, data: text}).catch(function(err){
          if(err && err.code === 'declined') return;
          downloadTextPlain(filename, text, mime);
        });
      }).catch(function(){ downloadTextPlain(filename, text, mime); });
      return;
    }
    downloadTextPlain(filename, text, mime);
  }

  function downloadTextPlain(filename, text, mime){
    try{
      var blob = new Blob([text], {type: mime});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){}
  }

  function downloadCSVPlain(filename, csvText){
    try{
      var blob = new Blob(["\uFEFF"+csvText], {type:'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      // Brave(iOS)等は日本語のファイル名がURLエンコードされて表示されるため、日本語を含む場合は英数字名にする
      var dlName = filename;
      if(/[^\x20-\x7E]/.test(dlName)){
        var d = new Date();
        function p2(n){ return (n<10?'0':'')+n; }
        dlName = 'mochimono-' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.csv';
      }
      a.download = dlName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){
      view.csvFallbackText = csvText;
      view.csvFallbackOpen = true;
      render();
    }
  }

    if(view.csvFallbackOpen && view.csvFallbackText){

        if(eplan.created.length){ html += '<p class="hint"><b style="color:var(--amber);">新規 '+eplan.created.length+'件</b>（持ち物マスタにも登録されます）：'+namesPreview(eplan.created)+'</p>'; }
        if(eplan.already.length){ html += '<p class="hint"><b>追加済み '+eplan.already.length+'件</b>'+((eplan.hasBring||eplan.hasChecked)?'（'+[eplan.hasBring?'持込/レンタル':'', eplan.hasChecked?'チェック状態':''].filter(Boolean).join('・')+'をCSVの内容で上書き）':'（変更なし）')+'：'+namesPreview(eplan.already)+'</p>'; }
        if(eplan.hasChecked && (eplan.fromMaster.length||eplan.created.length)){ html += '<p class="hint">チェック状態もCSVの内容が反映されます。</p>'; }
      }
      html += '<div class="row-between" style="margin-bottom:0;">';
      html += '<button class="btn ghost" id="entry-import-cancel" style="flex:1;margin-right:8px;">キャンセル</button>';

      html += '</div></div>';
    }
    html += '<div class="op-row">';

    html += '<div class="op-label">イベント操作</div>';

      html += '<button class="btn danger" id="delete-confirm-btn" style="flex:1;">削除する</button>';
      html += '</div>';
      html += '</div>';

      html += '<button class="btn danger" id="delete-entry-btn">削除</button>';
      html += '</div>';

    return html;

  var EYE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';

  function renderCustomItemForm(mode){
    var html = '<div class="panel">';
    html += '<div class="panel-label">この'+modeLabel(mode)+'だけの持ち物を追加</div>';
    html += '<div style="display:flex;gap:8px;">';

    html += '<div id="custom-item-suggest" class="suggest"></div>';
    html += '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer;"><input type="checkbox" id="custom-item-master"'+(view.newCustomMaster?' checked':'')+' style="width:auto;margin:0;"> 持ち物マスタにも登録する</label>';
    html += '</div>';
    return html;
  }

  function renderEditItemsPanel(mode, entry){
    var included = itemsForEntry(mode, entry);
    var candidates = candidateItemsForEntry(mode, entry);
    var html = '';

    html += '<div class="panel">';
    html += '<div class="panel-label">このリストに含まれている</div>';
    html += '<p class="hint">持ち物名の変更・「持込／レンタル」・表示/非表示は、この'+modeLabel(mode)+'だけの設定です（他のイベントや「設定」タブの持ち物一覧には影響しません）。いずれもトグルになってます。チェックリストで「非表示にする」を押した持ち物は、ここの「表示」ボタンで元に戻せます。</p>';
    var hiddenCount = included.filter(function(it){ return isHiddenForEntry(it, entry); }).length;
    html += '<label style="display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="show-hidden-toggle"'+(view.showHiddenInEdit?' checked':'')+' style="width:auto;margin:0;"> 非表示の持ち物も表示する（'+hiddenCount+'件）</label>';
    if(included.length===0){
      html += '<div class="empty">まだありません</div>';
    } else {
      included.forEach(function(it){
        var hiddenNow = isHiddenForEntry(it, entry);
        if(hiddenNow && !view.showHiddenInEdit) return;
        html += '<div class="swipe-wrap"><button class="swipe-bg del" data-remove-item="'+it.id+'">削除</button><div class="item-row swipe-row" data-swipe-row="'+it.id+'" data-swipe-kind="del" style="align-items:flex-start;">';
        html += '<div style="flex:1;min-width:0;"><input type="text" class="item-name-input" data-item-rename="'+it.id+'" value="'+esc(effectiveItemName(it, entry))+'">';
        if(it.local){ html += '<div class="item-meta"><span class="local-tag">この'+modeLabel(mode)+'だけ</span> <button class="btn ghost" data-promote-item="'+it.id+'" style="padding:2px 7px;font-size:10px;">マスタに登録</button></div>'; }
        html += '</div>';
        html += '<div style="display:flex;gap:4px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:52%;">';
        html += '<button class="btn ghost" data-toggle-entry-bring="'+it.id+'" style="padding:4px 8px;font-size:11px;white-space:nowrap;'+(isBringForEntry(it,entry)?'':'color:var(--amber);border-color:var(--amber);')+'">'+(isBringForEntry(it,entry)?'持込':'レンタル')+'</button>';
        var pinnedNow = (entry.pinnedIds||[]).indexOf(it.id)!==-1;
        html += '<button class="btn ghost" data-toggle-pin="'+it.id+'" style="padding:4px 8px;font-size:12px;line-height:1.2;'+(pinnedNow?'border-color:var(--amber);background:var(--amber-dim);':'opacity:.55;')+'" aria-label="'+(pinnedNow?'ピン留め中（押すと解除）':'ピン留めする')+'" title="'+(pinnedNow?'ピン留め中（押すと解除）':'ピン留めする')+'">📌</button>';
        html += '<button class="btn ghost" data-toggle-entry-visible="'+it.id+'" style="padding:5px 9px;line-height:0;'+(hiddenNow?'color:var(--amber);border-color:var(--amber);':'')+'" aria-label="'+(hiddenNow?'非表示中（押すと表示）':'表示中（押すと非表示）')+'" title="'+(hiddenNow?'非表示中（押すと表示）':'表示中（押すと非表示）')+'">'+(hiddenNow?EYE_OFF_SVG:EYE_SVG)+'</button>';
        html += '<button class="del-x" data-remove-item="'+it.id+'">×</button>';
        html += '</div>';
        html += '</div></div>';
      });
    }
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-label">追加できる持ち物</div>';
    if(candidates.length===0){
      html += '<div class="empty">追加できる持ち物がありません。「持ち物」タブで新しく登録してください。</div>';
    } else {
      candidates.forEach(function(it){
        html += '<div class="item-row">';
        html += '<div><div class="item-name">'+esc(it.name)+(isBring(it)?'':' <span style="color:var(--cream-dim);font-size:11px;">(レンタル)</span>')+'</div>';
        if(it.roles && it.roles.length){
          html += '<div class="item-meta">'+it.roles.map(esc).join(' / ')+'</div>';
        }
        html += '</div>';
        html += '<button class="btn ghost" data-add-item="'+it.id+'" style="padding:5px 10px;">+ 追加</button>';
        html += '</div>';
      });
    }
    html += '</div>';

    return html;
  }

        if(!entry) return;
        if(entry.itemIds.indexOf(b.dataset.addItem)===-1) entry.itemIds.push(b.dataset.addItem);
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-remove-item]').forEach(function(b){
      b.onclick = function(){
        var list = listForMode(view.mode);
        var entry = list.filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(!entry) return;
        var idx = entry.itemIds.indexOf(b.dataset.removeItem);
        if(idx!==-1) entry.itemIds.splice(idx,1);
        state.items = state.items.filter(function(it){ return !(it.local && it.id===b.dataset.removeItem); });
        if(entry.pinnedIds){ entry.pinnedIds = entry.pinnedIds.filter(function(id){ return id!==b.dataset.removeItem; }); }
        var key = checkKey(view.mode, entry.id);
        if(state.checks[key]) delete state.checks[key][b.dataset.removeItem];
        if(entry.bringOverride) delete entry.bringOverride[b.dataset.removeItem];
        if(entry.nameOverride) delete entry.nameOverride[b.dataset.removeItem];
        if(entry.hiddenIds){
          var hIdx = entry.hiddenIds.indexOf(b.dataset.removeItem);
          if(hIdx!==-1) entry.hiddenIds.splice(hIdx,1);
        }
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-toggle-entry-bring]').forEach(function(b){
      b.onclick = function(){
        var list = listForMode(view.mode);
        var entry = list.filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(!entry) return;
        var item = state.items.filter(function(it){return it.id===b.dataset.toggleEntryBring;})[0];
        if(!item) return;
        if(!entry.bringOverride) entry.bringOverride = {};
        entry.bringOverride[item.id] = !isBringForEntry(item, entry);
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-hide-item]').forEach(function(b){
      b.onclick = function(){
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(!entry) return;
        if(!entry.hiddenIds) entry.hiddenIds = [];
        if(entry.hiddenIds.indexOf(b.dataset.hideItem)===-1) entry.hiddenIds.push(b.dataset.hideItem);
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-toggle-entry-visible]').forEach(function(b){
      b.onclick = function(){
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(!entry || !entry.hiddenIds) return;
        var idx = entry.hiddenIds.indexOf(b.dataset.toggleEntryVisible);
        if(idx!==-1) entry.hiddenIds.splice(idx,1); else entry.hiddenIds.push(b.dataset.toggleEntryVisible);
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('.toggle[data-item], .check-label[data-item]').forEach(function(t){
      t.onclick = function(){
        var key = checkKey(view.mode, view.selectedByMode[view.mode]);
        if(!state.checks[key]) state.checks[key] = {};
        state.checks[key][t.dataset.item] = !state.checks[key][t.dataset.item];
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(entry) entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    var resetCheckBtn = document.getElementById('reset-check-btn');
    if(resetCheckBtn){
      resetCheckBtn.onclick = function(){
        var key = checkKey(view.mode, view.selectedByMode[view.mode]);
        state.checks[key] = {};
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(entry) entry.updatedAt = Date.now();
        saveState();
        render();
      };
    }

    var csvExportBtn = document.getElementById('csv-export-btn');
    if(csvExportBtn){
      csvExportBtn.onclick = function(){
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(!entry) return;
        var csv = entryToCSV(view.mode, entry);
        downloadCSV(entry.name.replace(/[\\/:*?"<>|]/g,'_') + '.csv', csv);
      };
    }

    var csvImportBtn = document.getElementById('csv-import-btn');
    var csvImportInput = document.getElementById('csv-import-input');

      csvImportBtn.onclick = function(){ csvImportInput.click(); };

        var file = csvImportInput.files && csvImportInput.files[0];

        reader.onload = function(){
          var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];

            view.entryImportPlan = planEntryImport(view.mode, entry, String(reader.result));

          var cb = document.getElementById('entry-import-cancel');
          if(cb && cb.scrollIntoView) cb.scrollIntoView({block:'center'});
        };
        reader.readAsText(file, 'UTF-8');

    var entryImportConfirm = document.getElementById('entry-import-confirm');

      entryImportConfirm.onclick = function(){
        var plan = view.entryImportPlan;
        var entry = currentEntry();
        view.entryImportPlan = null;
        if(plan && entry && plan.entryId===entry.id){
          importCSVIntoEntry(view.mode, entry, plan.text);

        render();

    if(deleteCancelBtn){
      deleteCancelBtn.onclick = function(){
        view.confirmDeleteEntry = false;
        render();
      };
    }

    function deleteEntryById(mode, id){
      var list = listForMode(mode);
      var idx = list.findIndex(function(e){ return e.id===id; });
      if(idx!==-1) list.splice(idx,1);
      state.items = state.items.filter(function(it){ return !(it.local && it.ownerId===id); });
      delete state.checks[checkKey(mode, id)];
    }

        if(idx!==-1) list.splice(idx,1);

      copyEntryBtn.onclick = function(){
        var list = listForMode(view.mode);
        var entry = list.filter(function(e){return e.id===view.selectedByMode[view.mode];})[0];
        if(!entry) return;
        var copyEntry = {
          id: uid(),
          name: entry.name + 'のコピー',
          date: entry.date || '',
          time: entry.time || '',
          endTime: entry.endTime || '',
          artist: entry.artist || '',
          roles: (entry.roles||[]).slice(),
          itemIds: (entry.itemIds||[]).slice(),
          updatedAt: Date.now()
        };
        var idMap = {};
        state.items.filter(function(it){ return it.local && it.ownerId===entry.id; }).forEach(function(it){
          var c = {id:uid(), name:it.name, scope:it.scope.slice(), roles:[], bring:it.bring, local:true, ownerId:copyEntry.id};
          state.items.push(c);
          idMap[it.id] = c.id;
        });
        copyEntry.itemIds = copyEntry.itemIds.map(function(id){ return idMap[id] || id; });
        function mapKeys(src){
          var out = {};
          for(var k in src){ out[idMap[k] || k] = src[k]; }
          return out;
        }

    function updateSuggest(){
      var box = document.getElementById('custom-item-suggest');
      var entry = currentEntry();
      if(!box || !entry || !customNameEl) return;
      var q = normName(customNameEl.value);
      var btn = customAddBtn;
      if(btn) btn.textContent = '追加';
      if(!q){ box.innerHTML = ''; return; }
      var inEntry = {};
      (entry.itemIds||[]).forEach(function(id){ inEntry[id] = true; });
      var found = [], exact = false;
      state.items.forEach(function(it){
        if(it.local && it.ownerId!==entry.id) return;
        var n = normName(effectiveItemName(it, entry));
        var n2 = normName(it.name);
        var hit = (n && (n.indexOf(q)!==-1 || q.indexOf(n)!==-1)) || (n2 && (n2.indexOf(q)!==-1 || q.indexOf(n2)!==-1));
        if(!hit) return;
        if(n===q || n2===q) exact = true;
        found.push(it);
      });
      if(found.length===0){ box.innerHTML = ''; return; }
      found.sort(function(a,b){ return (inEntry[b.id]?1:0)-(inEntry[a.id]?1:0); });
      var h = '<div class="suggest-note">'+(exact?'同じ名前の持ち物があります。別の持ち物として追加もできます。':'似た持ち物があります。')+'</div>';
      found.slice(0,5).forEach(function(it){
        var here = !!inEntry[it.id];
        h += '<div class="suggest-row"><div class="nm">'+esc(effectiveItemName(it, entry))+'</div>';
        h += '<span class="suggest-tag">'+(it.local ? 'このイベント専用' : 'マスタ')+(here?'・追加済み':'')+'</span>';
        if(!here){ h += '<button class="btn ghost" data-suggest-add="'+it.id+'" style="padding:3px 9px;font-size:11px;">これを追加</button>'; }
        h += '</div>';
      });
      box.innerHTML = h;
      if(btn && exact) btn.textContent = '別に追加';
      box.querySelectorAll('[data-suggest-add]').forEach(function(b){
        b.onclick = function(){
          var e2 = currentEntry();
          if(!e2) return;
          if(e2.itemIds.indexOf(b.dataset.suggestAdd)===-1) e2.itemIds.push(b.dataset.suggestAdd);
          e2.updatedAt = Date.now();
          saveState();
          render();
        };
      });
    }

    function closeSwipeRows(except){
      document.querySelectorAll('.swipe-row.swipe-open').forEach(function(r){
        if(r===except) return;
        r.classList.remove('swipe-open'); r.style.transform='';
        setTimeout(function(){ if(r.parentNode && !r.classList.contains('swipe-open')) r.parentNode.classList.remove('sw-on'); }, 200);
      });
    }
    document.querySelectorAll('[data-swipe-row]').forEach(function(row){
      var kind = row.dataset.swipeKind;
      var startX=0, startY=0, dx=0, tracking=false, moved=false, pid=null, wasOpen=false, canRight=false;
      var OPEN = 88;
      row.addEventListener('pointerdown', function(ev){
        if(ev.target.closest('button')) return;
        wasOpen = row.classList.contains('swipe-open');
        closeSwipeRows(row);
        tracking=true; moved=false; dx=0; startX=ev.clientX; startY=ev.clientY; pid=ev.pointerId;
        // 画面左端からのスワイプは、iPhoneの「戻る」操作と重なるので右スワイプとして扱わない
        canRight = !!row.dataset.swipeRight && ev.clientX > 28;
      });
      row.addEventListener('pointermove', function(ev){
        if(!tracking || ev.pointerId!==pid) return;
        var mx = ev.clientX-startX, my = ev.clientY-startY;
        if(!moved){
          if(Math.abs(mx)<10) return;
          if(Math.abs(my)>Math.abs(mx)){ tracking=false; return; }
          moved=true;
          row.parentNode.classList.add('sw-on');
          row.classList.add('swiping');
          try{ row.setPointerCapture(pid); }catch(e){}
        }
        var base = wasOpen ? -OPEN : 0;
        dx = canRight ? Math.min(160, base+mx) : Math.min(0, base+mx);
        row.parentNode.classList.toggle('sw-right', dx>0);
        row.style.transform = 'translateX('+dx+'px)';
      });
      function end(){
        if(!tracking) return;
        tracking=false;
        row.classList.remove('swiping');
        if(moved){
          if(canRight && dx > 90 && row.dataset.swipeRight==='pin-entry'){
            row.style.transform='';
            var ev2 = listForMode(view.mode).filter(function(x){ return x.id===row.dataset.entry; })[0];
            if(ev2){ ev2.pinned = !ev2.pinned; saveState(); }   // 並び順が変わらないよう updatedAt は更新しない
            setTimeout(render, 120);
          } else if(canRight && dx > 90){
            row.style.transform='';
            var pid2=row.dataset.swipeRow;
            var entryP=currentEntry();
            if(entryP){
              if(!entryP.pinnedIds) entryP.pinnedIds=[];
              var pi=entryP.pinnedIds.indexOf(pid2);
              if(pi===-1) entryP.pinnedIds.push(pid2); else entryP.pinnedIds.splice(pi,1);
              entryP.updatedAt=Date.now();
              saveState();
            }
            setTimeout(render, 120);
          } else if(kind==='hide' && dx < -90){
            row.style.transform='translateX(-110%)';
            var id=row.dataset.swipeRow;
            setTimeout(function(){
              var entry=currentEntry();
              if(!entry) return;
              if(!entry.hiddenIds) entry.hiddenIds=[];
              if(entry.hiddenIds.indexOf(id)===-1) entry.hiddenIds.push(id);
              entry.updatedAt=Date.now();
              saveState();
              render();
            }, 180);
          } else if(kind==='del' && dx < -OPEN/2){
            row.classList.add('swipe-open');
            row.style.transform='translateX(-'+OPEN+'px)';
          } else {
            row.classList.remove('swipe-open');
            row.style.transform='';
            setTimeout(function(){ if(!row.classList.contains('swipe-open')) row.parentNode.classList.remove('sw-on'); }, 200);
          }
          row._swiped = true;
          setTimeout(function(){ row._swiped=false; }, 350);
        } else if(wasOpen){
          row._swiped = true;
          setTimeout(function(){ row._swiped=false; }, 350);
        }
      }
      row.addEventListener('pointerup', end);
      row.addEventListener('pointercancel', end);
      row.addEventListener('click', function(ev){
        if(row._swiped){ ev.stopPropagation(); ev.preventDefault(); }
      }, true);
    });
