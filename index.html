<title>バンドマン持ち物リスト</title>
<style>
  :root{
    --bg:#1c1b19;
    --panel:#242220;
    --panel-raised:#2c2925;
    --seam:#3a352e;
    --cream:#eee6d6;
    --cream-dim:#a89f8d;
    --amber:#e8a23c;
    --amber-dim:#8a6226;
    --teal:#4f8c85;
    --teal-dim:#2f524d;
    --red:#c1543c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  h1,h2,h3{
    font-family:'Oswald',-apple-system,sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
  }
  .header{
    padding:calc(22px + env(safe-area-inset-top, 0px)) 18px 16px;
    background:linear-gradient(180deg,#231f1c,#1c1b19);
    border-bottom:1px solid var(--seam);
    position:relative;
  }
  .header .led{
    position:absolute;
    top:24px; right:20px;
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 6px 1px rgba(232,162,60,.7);
  }
  .header h1{font-size:19px;color:var(--cream);}
  .header p{margin:4px 0 0;font-size:12.5px;color:var(--cream-dim);}

  .container{max-width:480px;margin:0 auto;padding:16px;}

  .panel{
    background:var(--panel);
    border:1px solid var(--seam);
    border-radius:var(--radius);
    padding:14px 14px 16px;
    margin-bottom:14px;
    overflow-x:hidden;
  }
  .panel-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--amber);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .panel-label::before{
    content:'';
    width:5px;height:5px;border-radius:50%;
    background:var(--amber);
  }

  /* nav footswitches (under the header now) */
  .nav{
    display:flex;
    background:#161513;
    border-bottom:1px solid var(--seam);
    padding:10px 10px;
    gap:8px;
  }
  .nav button{
    flex:1;
    background:var(--panel-raised);
    border:1px solid var(--seam);
    border-radius:8px;
    color:var(--cream-dim);
    font-family:'Oswald',sans-serif;
    font-size:11.5px;
    letter-spacing:.02em;
    padding:10px 2px;
    cursor:pointer;
  }
  .nav button.active{
    color:#1c1b19;
    background:var(--amber);
    border-color:var(--amber);
  }

  /* form controls */
  input[type=text],input[type=date],select,textarea{
    width:100%;
    background:#1a1917;
    border:1px solid var(--seam);
    color:var(--cream);
    border-radius:7px;
    padding:9px 10px;
    font-size:14.5px;
    margin-bottom:8px;
  }
  input[type=date]{
    color-scheme:dark;
    -webkit-appearance:none;
    appearance:none;
    min-width:0;
    display:block;
    height:38px;
    line-height:1.2;
  }
  input[type=text]::placeholder{color:#6d6558;}
  label.small{font-size:12px;color:var(--cream-dim);display:block;margin-bottom:4px;}

  .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{
    font-size:11.5px;
    padding:6px 12px;
    border-radius:99px;
    border:1px solid var(--seam);
    color:var(--cream-dim);
    background:#1a1917;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.on{
    background:var(--teal-dim);
    border-color:var(--teal);
    color:var(--cream);
  }
  .chip .x{margin-left:6px;color:var(--red);}

  .btn{
    background:var(--amber-dim);
    border:1px solid var(--amber);
    color:var(--cream);
    border-radius:7px;
    padding:9px 14px;
    font-size:13.5px;
    font-family:'Oswald',sans-serif;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid var(--seam);
    color:var(--cream-dim);
  }
  .btn.danger{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
  }
  .btn.block{width:100%;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn:disabled:active{transform:none;}

  /* item rows */
  .item-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--seam);
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{font-size:14px;}
  .item-meta{font-size:11px;color:var(--cream-dim);margin-top:2px;}
  .del-x{
    color:var(--red);
    font-size:16px;
    padding:2px 8px;
    cursor:pointer;
    background:none;border:none;
  }

  /* entry cards (studio/live list) */
  .entry-card{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-raised);
    border:1px solid var(--seam);
    border-radius:8px;
    padding:12px 12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .entry-card .name{font-size:15px;font-weight:600;font-family:'Oswald',sans-serif;}
  .entry-card .progress{font-size:12px;color:var(--amber);white-space:nowrap;margin-left:10px;}

  .empty{
    text-align:center;
    color:var(--cream-dim);
    font-size:13px;
    padding:24px 8px;
  }

  /* checklist */
  .check-row{
    display:flex;align-items:center;gap:12px;
    padding:11px 2px;
    border-bottom:1px solid var(--seam);
  }
  .check-row:last-child{border-bottom:none;}
  .toggle{
    width:38px;height:22px;
    border-radius:99px;
    background:#1a1917;
    border:1px solid var(--seam);
    position:relative;
    flex-shrink:0;
    cursor:pointer;
  }
  .toggle .knob{
    position:absolute;top:2px;left:2px;
    width:16px;height:16px;border-radius:50%;
    background:var(--cream-dim);
    transition:left .15s ease, background .15s ease;
  }
  .toggle.on{background:var(--teal-dim);border-color:var(--teal);}
  .toggle.on .knob{left:18px;background:var(--amber);}
  .check-label{font-size:14.5px;flex:1;}
  .check-label.done{color:var(--cream-dim);text-decoration:line-through;}

  .progress-bar-wrap{
    background:#1a1917;
    border:1px solid var(--seam);
    border-radius:99px;
    height:8px;
    overflow:hidden;
    margin-bottom:12px;
  }
  .progress-bar{height:100%;background:var(--amber);}

  .backrow{
    display:flex;align-items:center;gap:8px;
    margin-bottom:12px;
  }
  .backbtn{
    background:none;border:none;color:var(--cream-dim);
    font-size:20px;cursor:pointer;padding:0 6px 0 0;
  }
  .detail-title{font-size:17px;font-family:'Oswald',sans-serif;flex:1;}

  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .hint{font-size:11.5px;color:var(--cream-dim);margin:0 0 10px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

      ],

      ],
      recordings: [
        {id:uid(), name:'サンプルレコーディング', roles:['ボーカル'], itemIds: computeAutoItemIds('recording', ['ボーカル'], items), updatedAt:Date.now()}
      ],
      checks: {}
    };
  }

  var MODES = ['studio','live','recording'];
  var MODE_LABELS = {studio:'スタジオ', live:'ライブ', recording:'レコーディング'};

  function modeLabel(m){ return MODE_LABELS[m] || m; }

  function listForMode(mode){
    if(mode==='studio') return state.studios;
    if(mode==='live') return state.lives;
    return state.recordings;
  }

  // 新規スタジオ/ライブ/レコーディングを作った瞬間の「初期の持ち物リスト」。
  // 用途(該当モードを含むか)が合う持ち物のうち、
  // ・パートを何も選ばなかった場合 → とりあえず全部入れる
  // ・パートを選んだ場合 → 共通アイテム + そのパートに該当するアイテムだけを自動採用
  // あとは詳細画面の「持ち物を編集」で自由に増減できる。
  function computeAutoItemIds(mode, entryRoles, itemsList){
    var src = itemsList || state.items;
    return src.filter(function(it){
      var scopeOk = it.scope && it.scope.indexOf(mode)!==-1;
      if(!scopeOk) return false;
      if(!entryRoles || entryRoles.length===0) return true;
      if(!it.roles || it.roles.length===0) return true;
      return it.roles.some(function(r){ return entryRoles.indexOf(r)!==-1; });
    }).map(function(it){ return it.id; });
  }

  function migrateScope(scope){
    if(Array.isArray(scope)) return scope;
    if(scope==='both') return ['studio','live','recording'];
    if(scope==='studio') return ['studio'];
    if(scope==='live') return ['live'];
    return ['studio','live','recording'];
  }

  function migrateEntry(mode, e){
    if(!e.itemIds){
      e.itemIds = computeAutoItemIds(mode);
    }
    if(!e.updatedAt) e.updatedAt = 0;
    delete e.tags;
    return e;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed.items) return defaultState();
      if(!parsed.studios) parsed.studios = [];
      if(!parsed.lives) parsed.lives = [];
      if(!parsed.recordings) parsed.recordings = [];
      if(!parsed.roles) parsed.roles = defaultRoles();
      parsed.items.forEach(function(it){ delete it.tags; if(!it.roles) it.roles = []; it.scope = migrateScope(it.scope); });
      state = parsed;
      parsed.studios.forEach(function(e){ migrateEntry('studio', e); });
      parsed.lives.forEach(function(e){ migrateEntry('live', e); });
      parsed.recordings.forEach(function(e){ migrateEntry('recording', e); });
      return parsed;
    }catch(e){ return defaultState(); }
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();

  var view = {
    mode: 'studio',
    selectedId: null,
    newItemScope: ['studio','live','recording'],
    newItemRoles: [],
    newItemBring: true,
    newEntryRoles: [],
    editMode: false,
    confirmReset: false,
    csvFallbackOpen: false,
    csvFallbackText: ''
  };

  function scopeArrayLabel(scope){
    if(!scope || scope.length===0) return '(用途未設定)';
    if(scope.length===MODES.length) return '全シーン共通';
    return scope.map(modeLabel).join('・');
  }

  function itemsForEntry(mode, entry){
    var ids = entry.itemIds || [];
    return state.items.filter(function(it){ return ids.indexOf(it.id)!==-1; });
  }

  function candidateItemsForEntry(mode, entry){
    var ids = entry.itemIds || [];
    return state.items.filter(function(it){
      var scopeOk = it.scope && it.scope.indexOf(mode)!==-1;
      return scopeOk && ids.indexOf(it.id)===-1;
    });
  }

  function isBring(it){ return it.bring !== false; }

  function isBringForEntry(it, entry){
    if(entry && entry.bringOverride && entry.bringOverride.hasOwnProperty(it.id)){
      return !!entry.bringOverride[it.id];
    }
    return isBring(it);
  }

  function checkKey(mode, entryId){ return mode+':'+entryId; }

  function progressFor(mode, entry){
    var items = itemsForEntry(mode, entry).filter(function(it){ return isBringForEntry(it, entry); });
    var ck = state.checks[checkKey(mode, entry.id)] || {};
    var done = items.filter(function(it){ return ck[it.id]; }).length;
    return {done:done, total:items.length};
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- CSV ----------
  function csvEscape(s){
    s = String(s==null?'':s);
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function entryToCSV(mode, entry){
    var items = itemsForEntry(mode, entry);
    var ck = state.checks[checkKey(mode, entry.id)] || {};
    var rows = [['name','roles','scope','bring','checked']];
    items.forEach(function(it){
      rows.push([
        it.name,
        (it.roles||[]).join(';'),
        (it.scope||[]).join(';'),
        (isBringForEntry(it, entry)?'yes':'no'),
        (ck[it.id]?'true':'false')
      ]);
    });
    return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  }

  function parseCSVLine(line){
    var result = [];
    var cur = '';
    var inQuotes = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(inQuotes){
        if(c === '"'){
          if(line[i+1] === '"'){ cur+='"'; i++; }
          else { inQuotes=false; }
        } else { cur+=c; }
      } else {
        if(c === '"'){ inQuotes=true; }
        else if(c === ','){ result.push(cur); cur=''; }
        else { cur+=c; }
      }
    }
    result.push(cur);
    return result;
  }

  function parseCSV(text){
    var lines = text.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length>0; });
    return lines.map(parseCSVLine);
  }

  function importCSVIntoEntry(mode, entry, csvText){
    var rows = parseCSV(csvText);
    if(rows.length===0) return 0;
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var isFull = rows[0].length>1 && header.indexOf('name')!==-1;
    var dataRows = isFull ? rows.slice(1) : rows;
    var nameIdx = isFull ? header.indexOf('name') : 0;
    var rolesIdx = isFull ? header.indexOf('roles') : -1;
    var scopeIdx = isFull ? header.indexOf('scope') : -1;
    var bringIdx = isFull ? header.indexOf('bring') : -1;
    var checkedIdx = isFull ? header.indexOf('checked') : -1;

    var key = checkKey(mode, entry.id);
    if(!state.checks[key]) state.checks[key] = {};
    var count = 0;

    dataRows.forEach(function(row){
      var name = (row[nameIdx]||'').trim();
      if(!name) return;
      var item = state.items.filter(function(it){ return it.name===name; })[0];
      var isNewItem = !item;
      if(!item){
        var roles = rolesIdx!==-1 && row[rolesIdx] ? row[rolesIdx].split(';').map(function(s){return s.trim();}).filter(Boolean) : [];
        var scopeField = scopeIdx!==-1 && row[scopeIdx] ? row[scopeIdx].split(';').map(function(s){return s.trim();}).filter(function(s){ return MODES.indexOf(s)!==-1; }) : [mode];
        if(scopeField.length===0) scopeField = [mode];
        item = {id:uid(), name:name, scope:scopeField, roles:roles};
        state.items.push(item);
      }
      if(entry.itemIds.indexOf(item.id)===-1) entry.itemIds.push(item.id);
      if(bringIdx!==-1){
        var bringVal = (row[bringIdx]||'').trim().toLowerCase();
        var bringBool = !(bringVal==='no' || bringVal==='rental' || bringVal==='false');
        if(isNewItem){
          if(!bringBool) item.bring = false;
        } else {
          if(!entry.bringOverride) entry.bringOverride = {};
          entry.bringOverride[item.id] = bringBool;
        }
      }
      if(checkedIdx!==-1){
        var cv = (row[checkedIdx]||'').trim().toLowerCase();
        state.checks[key][item.id] = (cv==='true' || cv==='yes' || cv==='1');
      }
      count++;
    });
    entry.updatedAt = Date.now();
    return count;
  }

  function downloadCSV(filename, csvText){
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(downloads){
        if(!downloads){ downloadCSVPlain(filename, csvText); return; }
        return downloads.save({filename: filename, data: csvText}).catch(function(err){
          if(err && err.code === 'declined') return;
          downloadCSVPlain(filename, csvText);
        });
      }).catch(function(){ downloadCSVPlain(filename, csvText); });
      return;
    }
    downloadCSVPlain(filename, csvText);
  }

  function downloadCSVPlain(filename, csvText){
    try{
      var blob = new Blob(["\uFEFF"+csvText], {type:'text/csv;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){
      view.csvFallbackText = csvText;
      view.csvFallbackOpen = true;
      render();
    }
  }

  // ---------- render ----------
  function render(){
    document.querySelectorAll('.nav button').forEach(function(b){
      b.classList.toggle('active', b.dataset.mode===view.mode);
    });
    var app = document.getElementById('app');
    if(view.mode==='items'){
      app.innerHTML = renderItemsView();
    } else {
      if(view.selectedId){
        app.innerHTML = renderDetailView(view.mode, view.selectedId);
      } else {
        app.innerHTML = renderEntryListView(view.mode);
      }
    }
    bindEvents();
  }

  function renderEntryListView(mode){
    var list = listForMode(mode);
    var label = modeLabel(mode);
    var placeholders = {
      studio: '例: いつものスタジオ',
      live: '例: 対バンライブ',
      recording: '例: 新曲レコーディング'
    };

    var html = '';
    html += '<div class="panel">';
    html += '<div class="panel-label">'+label+'を登録</div>';
    if(state.roles.length>0){
      html += '<label class="small">担当パート(任意・複数選択可)</label>';
      html += '<div class="chip-wrap">';
      state.roles.forEach(function(r){
        var on = view.newEntryRoles.indexOf(r)!==-1;
        html += '<span class="chip'+(on?' on':'')+'" data-role-entry="'+esc(r)+'">'+esc(r)+'</span>';
      });
      html += '</div>';
      html += '<p class="hint">選ぶと、そのパート＋共通の持ち物だけで自動リストを作ります。未選択なら一旦全部入れます。</p>';
    }
    var defaultNames = {
      studio: 'いつものスタジオ',
      live: '次のライブ',
      recording: '次のレコーディング'
    };
    html += '<label class="small">'+label+'名</label>';
    html += '<input type="text" id="entry-name" placeholder="'+placeholders[mode]+'" value="'+(defaultNames[mode]?esc(defaultNames[mode]):'')+'">';
    html += '<label class="small">対象日(任意)</label>';
    html += '<input type="date" id="entry-date">';
    html += '<button class="btn block" id="add-entry-btn">+ '+label+'を追加</button>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-label">登録済み '+label+'（'+list.length+'）</div>';
    if(list.length===0){
      html += '<div class="empty">まだ登録がありません</div>';
    } else {
      var sorted = list.slice().sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
      sorted.forEach(function(e){
        var p = progressFor(mode, e);
        html += '<div class="entry-card" data-entry="'+e.id+'">';
        html += '<div><div class="name">'+esc(e.name)+'</div>';
        if(e.date){ html += '<div class="progress" style="color:var(--cream-dim);margin-left:0;">'+esc(e.date)+'</div>'; }
        if(e.roles && e.roles.length){ html += '<div class="progress" style="color:var(--cream-dim);margin-left:0;">'+e.roles.map(esc).join(' / ')+'</div>'; }
        html += '</div>';
        html += '<div class="progress">'+p.done+' / '+p.total+'</div>';
        html += '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderDetailView(mode, entryId){
    var list = listForMode(mode);
    var entry = list.filter(function(e){return e.id===entryId;})[0];
    if(!entry){ view.selectedId = null; return renderEntryListView(mode); }

    var items = itemsForEntry(mode, entry);
    var bringItems = items.filter(function(it){ return isBringForEntry(it, entry); });
    var ck = state.checks[checkKey(mode, entry.id)] || {};
    var done = bringItems.filter(function(it){return ck[it.id];}).length;
    var pct = bringItems.length? Math.round(done/bringItems.length*100) : 0;

    var html = '';
    html += '<div class="backrow">';
    html += '<button class="backbtn" id="back-btn">←</button>';
    html += '<div class="detail-title">'+esc(entry.name)+'</div>';
    html += '</div>';

    html += '<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%"></div></div>';

    html += '<div class="row-between">';
    html += '<div class="panel-label" style="margin-bottom:0;">'+(view.editMode?'含める持ち物を選ぶ':'持ち物チェックリスト')+'</div>';
    html += '<button class="btn ghost" id="toggle-edit-btn">'+(view.editMode?'完了':'持ち物を編集')+'</button>';
    html += '</div>';
    if(!view.editMode){
      html += '<p class="hint" style="margin-top:-6px;">レンタルする場合は、持ち物を編集から設定できます。</p>';
    }

    if(view.editMode){
      html += renderEditItemsPanel(mode, entry);
    } else {
      html += '<div class="panel">';
      if(items.length===0){
        html += '<div class="empty">まだ持ち物がありません。「持ち物を編集」から追加してください。</div>';
      } else {
        items.forEach(function(it){
          if(!isBringForEntry(it, entry)){
            html += '<div class="check-row" style="opacity:.5;">';
            html += '<div style="width:38px;flex-shrink:0;text-align:center;font-size:9.5px;color:var(--cream-dim);">レンタル</div>';
            html += '<div class="check-label">'+esc(it.name)+'</div>';
            html += '</div>';
            return;
          }
          var on = !!ck[it.id];
          html += '<div class="check-row">';
          html += '<div class="toggle'+(on?' on':'')+'" data-item="'+it.id+'"><div class="knob"></div></div>';
          html += '<div class="check-label'+(on?' done':'')+'">'+esc(it.name)+'</div>';
          html += '</div>';
        });
      }
      html += '</div>';
    }

    if(view.csvFallbackOpen && view.csvFallbackText){
      html += '<div class="panel">';
      html += '<div class="panel-label">CSV（自動ダウンロードできなかったので、コピーしてお使いください）</div>';
      html += '<textarea id="csv-fallback-text" readonly style="width:100%;height:120px;background:#1a1917;border:1px solid var(--seam);color:var(--cream);border-radius:7px;padding:9px;font-size:12px;">'+esc(view.csvFallbackText)+'</textarea>';
      html += '<div class="row-between" style="margin-top:8px;margin-bottom:0;">';
      html += '<button class="btn ghost" id="csv-fallback-copy" style="flex:1;margin-right:8px;">コピー</button>';
      html += '<button class="btn ghost" id="csv-fallback-close" style="flex:1;">閉じる</button>';
      html += '</div>';
      html += '</div>';
    }

    html += '<div class="row-between">';
    html += '<button class="btn ghost" id="csv-export-btn">CSV出力</button>';
    html += '<button class="btn ghost" id="csv-import-btn">CSV取り込み</button>';
    html += '</div>';
    html += '<input type="file" id="csv-import-input" accept=".csv,text/csv" style="display:none;">';

    html += '<div class="row-between">';
    html += '<button class="btn ghost" id="reset-check-btn">チェックをリセット</button>';
    html += '<button class="btn danger" id="delete-entry-btn">この'+modeLabel(mode)+'を削除</button>';
    html += '</div>';

    return html;
  }

  function renderEditItemsPanel(mode, entry){
    var included = itemsForEntry(mode, entry);
    var candidates = candidateItemsForEntry(mode, entry);
    var html = '';

    html += '<div class="panel">';
    html += '<div class="panel-label">このリストに含まれている</div>';
    html += '<p class="hint">「持ってく／レンタル」は、この'+modeLabel(mode)+'だけの設定です（他のイベントには影響しません）。持ってく↔︎レンタルはトグルになってます。</p>';
    if(included.length===0){
      html += '<div class="empty">まだありません</div>';
    } else {
      included.forEach(function(it){
        html += '<div class="item-row">';
        html += '<div class="item-name">'+esc(it.name)+'</div>';
        html += '<div style="display:flex;gap:4px;align-items:center;">';
        html += '<button class="btn ghost" data-toggle-entry-bring="'+it.id+'" style="padding:4px 8px;font-size:11px;white-space:nowrap;">'+(isBringForEntry(it,entry)?'持ってく':'レンタル')+'</button>';
        html += '<button class="del-x" data-remove-item="'+it.id+'">×</button>';
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-label">追加できる持ち物</div>';
    if(candidates.length===0){
      html += '<div class="empty">追加できる持ち物がありません。「持ち物」タブで新しく登録してください。</div>';
    } else {
      candidates.forEach(function(it){
        html += '<div class="item-row">';
        html += '<div><div class="item-name">'+esc(it.name)+(isBring(it)?'':' <span style="color:var(--cream-dim);font-size:11px;">(レンタル)</span>')+'</div>';
        if(it.roles && it.roles.length){
          html += '<div class="item-meta">'+it.roles.map(esc).join(' / ')+'</div>';
        }
        html += '</div>';
        html += '<button class="btn ghost" data-add-item="'+it.id+'" style="padding:5px 10px;">+ 追加</button>';
        html += '</div>';
      });
    }
    html += '</div>';

    return html;
  }

  function renderItemsView(){
    var html = '';
    html += '<div class="panel">';
    html += '<div class="panel-label">持ち物を追加</div>';
    html += '<input type="text" id="item-name" placeholder="例: エフェクターボード">';
    html += '<label class="small">用途(複数選択可)</label>';
    html += '<div class="chip-wrap" id="scope-chips">';
    MODES.forEach(function(m){
      var on = view.newItemScope.indexOf(m)!==-1;
      html += '<span class="chip'+(on?' on':'')+'" data-scope-item="'+m+'">'+modeLabel(m)+'</span>';
    });
    html += '</div>';
    html += '<label class="small">パート(任意・複数選択可、未選択＝全員共通)</label>';
    html += '<div class="chip-wrap">';
    state.roles.forEach(function(r){
      var on = view.newItemRoles.indexOf(r)!==-1;
      html += '<span class="chip'+(on?' on':'')+'" data-role-item="'+esc(r)+'">'+esc(r)+'</span>';
    });
    html += '</div>';
    html += '<p class="hint">選んだ用途のシーンで新規リストに自動で入ります。パート指定ありの持ち物は、既存のスタジオ/ライブ/レコーディングには自動追加されないので「持ち物を編集」から個別に追加してください。</p>';
    html += '<label class="small">初期状態</label>';
    html += '<div class="chip-wrap">';
    html += '<span class="chip'+(view.newItemBring?' on':'')+'" data-bring-new="bring">持ってく</span>';
    html += '<span class="chip'+(!view.newItemBring?' on':'')+'" data-bring-new="rental">レンタル</span>';
    html += '</div>';
    html += '<p class="hint">「レンタル」にすると、チェックリスト上でグレー表示になり、チェック対象・進捗カウントから外れます。各持ち物ごと、あとで一覧から切り替えられます。</p>';
    html += '<button class="btn block" id="add-item-btn">+ 持ち物を追加</button>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-label">登録済みの持ち物（'+state.items.length+'）</div>';
    if(state.items.length===0){
      html += '<div class="empty">持ち物が登録されていません</div>';
    } else {
      state.items.forEach(function(it){
        html += '<div class="item-row">';
        html += '<div><div class="item-name">'+esc(it.name)+'</div>';
        html += '<div class="item-meta">'+scopeArrayLabel(it.scope)+(it.roles&&it.roles.length? ' ・ '+it.roles.map(esc).join(' / ') : ' ・ 全パート共通')+'</div></div>';
        html += '<div style="display:flex;gap:4px;align-items:center;">';
        html += '<button class="btn ghost" data-toggle-bring="'+it.id+'" style="padding:4px 8px;font-size:11px;white-space:nowrap;">'+(isBring(it)?'持ってく':'レンタル')+'</button>';
        html += '<button class="del-x" data-item-del="'+it.id+'">×</button>';
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-label">パートを管理</div>';
    html += '<input type="text" id="role-name" placeholder="例: サポートキーボード">';
    html += '<button class="btn block" id="add-role-btn">+ パートを追加</button>';
    if(state.roles.length>0){
      html += '<p class="hint" style="margin-top:10px;">▲▼で並び順を変更できます。</p>';
      state.roles.forEach(function(r, i){
        html += '<div class="item-row">';
        html += '<div class="item-name">'+esc(r)+'</div>';
        html += '<div style="display:flex;gap:4px;align-items:center;">';
        html += '<button class="btn ghost" data-role-up="'+esc(r)+'" style="padding:4px 9px;font-size:12px;"'+(i===0?' disabled':'')+'>▲</button>';
        html += '<button class="btn ghost" data-role-down="'+esc(r)+'" style="padding:4px 9px;font-size:12px;"'+(i===state.roles.length-1?' disabled':'')+'>▼</button>';
        html += '<button class="del-x" data-role-del="'+esc(r)+'">×</button>';
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-label">データ管理</div>';
    html += '<p class="hint">この端末のブラウザ内にのみ保存されます（他の端末とは同期されません）。</p>';
    if(view.confirmReset){
      html += '<p class="hint" style="color:var(--red);">本当に全ての持ち物・スタジオ・ライブ・レコーディング・チェック状態を削除しますか？この操作は取り消せません。</p>';
      html += '<div class="row-between" style="margin-bottom:0;">';
      html += '<button class="btn ghost" id="reset-cancel-btn" style="flex:1;margin-right:8px;">キャンセル</button>';
      html += '<button class="btn danger" id="reset-confirm-btn" style="flex:1;">削除する</button>';
      html += '</div>';
    } else {
      html += '<button class="btn danger block" id="reset-all-btn">全データを初期化</button>';
    }
    html += '</div>';

    return html;
  }

  // ---------- events ----------
  function bindEvents(){
    document.querySelectorAll('.nav button').forEach(function(b){
      b.onclick = function(){
        view.mode = b.dataset.mode;
        view.selectedId = null;
        view.editMode = false;
        view.newEntryRoles = [];
        view.confirmReset = false;
        view.csvFallbackOpen = false;
        view.csvFallbackText = '';
        render();
      };
    });

    var addEntryBtn = document.getElementById('add-entry-btn');
    if(addEntryBtn){
      addEntryBtn.onclick = function(){
        var nameEl = document.getElementById('entry-name');
        var dateEl = document.getElementById('entry-date');
        var name = nameEl.value.trim();
        if(!name){ nameEl.focus(); return; }
        var entry = {id:uid(), name:name, date:(dateEl?dateEl.value:''), roles:view.newEntryRoles.slice(), itemIds:computeAutoItemIds(view.mode, view.newEntryRoles), updatedAt:Date.now()};
        listForMode(view.mode).push(entry);
        view.newEntryRoles = [];
        saveState();
        render();
      };
    }

    document.querySelectorAll('[data-role-entry]').forEach(function(c){
      c.onclick = function(){
        var r = c.dataset.roleEntry;
        var idx = view.newEntryRoles.indexOf(r);
        if(idx===-1) view.newEntryRoles.push(r); else view.newEntryRoles.splice(idx,1);
        render();
      };
    });

    document.querySelectorAll('.entry-card').forEach(function(c){
      c.onclick = function(){
        view.selectedId = c.dataset.entry;
        view.editMode = false;
        view.csvFallbackOpen = false;
        view.csvFallbackText = '';
        render();
      };
    });

    var backBtn = document.getElementById('back-btn');
    if(backBtn){ backBtn.onclick = function(){ view.selectedId = null; view.editMode = false; view.csvFallbackOpen = false; view.csvFallbackText = ''; render(); }; }

    var toggleEditBtn = document.getElementById('toggle-edit-btn');
    if(toggleEditBtn){
      toggleEditBtn.onclick = function(){
        view.editMode = !view.editMode;
        render();
      };
    }

    document.querySelectorAll('[data-add-item]').forEach(function(b){
      b.onclick = function(){
        var list = listForMode(view.mode);
        var entry = list.filter(function(e){return e.id===view.selectedId;})[0];
        if(!entry) return;
        if(entry.itemIds.indexOf(b.dataset.addItem)===-1) entry.itemIds.push(b.dataset.addItem);
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-remove-item]').forEach(function(b){
      b.onclick = function(){
        var list = listForMode(view.mode);
        var entry = list.filter(function(e){return e.id===view.selectedId;})[0];
        if(!entry) return;
        var idx = entry.itemIds.indexOf(b.dataset.removeItem);
        if(idx!==-1) entry.itemIds.splice(idx,1);
        var key = checkKey(view.mode, entry.id);
        if(state.checks[key]) delete state.checks[key][b.dataset.removeItem];
        if(entry.bringOverride) delete entry.bringOverride[b.dataset.removeItem];
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-toggle-entry-bring]').forEach(function(b){
      b.onclick = function(){
        var list = listForMode(view.mode);
        var entry = list.filter(function(e){return e.id===view.selectedId;})[0];
        if(!entry) return;
        var item = state.items.filter(function(it){return it.id===b.dataset.toggleEntryBring;})[0];
        if(!item) return;
        if(!entry.bringOverride) entry.bringOverride = {};
        entry.bringOverride[item.id] = !isBringForEntry(item, entry);
        entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    document.querySelectorAll('.toggle[data-item]').forEach(function(t){
      t.onclick = function(){
        var key = checkKey(view.mode, view.selectedId);
        if(!state.checks[key]) state.checks[key] = {};
        state.checks[key][t.dataset.item] = !state.checks[key][t.dataset.item];
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedId;})[0];
        if(entry) entry.updatedAt = Date.now();
        saveState();
        render();
      };
    });

    var resetCheckBtn = document.getElementById('reset-check-btn');
    if(resetCheckBtn){
      resetCheckBtn.onclick = function(){
        var key = checkKey(view.mode, view.selectedId);
        state.checks[key] = {};
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedId;})[0];
        if(entry) entry.updatedAt = Date.now();
        saveState();
        render();
      };
    }

    var csvExportBtn = document.getElementById('csv-export-btn');
    if(csvExportBtn){
      csvExportBtn.onclick = function(){
        var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedId;})[0];
        if(!entry) return;
        var csv = entryToCSV(view.mode, entry);
        downloadCSV(entry.name.replace(/[\\/:*?"<>|]/g,'_') + '.csv', csv);
      };
    }

    var csvImportBtn = document.getElementById('csv-import-btn');
    var csvImportInput = document.getElementById('csv-import-input');
    if(csvImportBtn && csvImportInput){
      csvImportBtn.onclick = function(){ csvImportInput.click(); };
      csvImportInput.onchange = function(){
        var file = csvImportInput.files && csvImportInput.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          var entry = listForMode(view.mode).filter(function(e){return e.id===view.selectedId;})[0];
          if(entry){
            importCSVIntoEntry(view.mode, entry, String(reader.result));
            saveState();
          }
          csvImportInput.value = '';
          render();
        };
        reader.readAsText(file, 'UTF-8');
      };
    }

    var csvFallbackCopy = document.getElementById('csv-fallback-copy');
    if(csvFallbackCopy){
      csvFallbackCopy.onclick = function(){
        var ta = document.getElementById('csv-fallback-text');
        try{
          ta.select();
          ta.setSelectionRange(0, 999999);
          navigator.clipboard && navigator.clipboard.writeText(ta.value);
        }catch(e){}
      };
    }

    var csvFallbackClose = document.getElementById('csv-fallback-close');
    if(csvFallbackClose){
      csvFallbackClose.onclick = function(){
        view.csvFallbackOpen = false;
        view.csvFallbackText = '';
        render();
      };
    }

    var deleteEntryBtn = document.getElementById('delete-entry-btn');
    if(deleteEntryBtn){
      deleteEntryBtn.onclick = function(){
        var list = listForMode(view.mode);
        var idx = list.findIndex(function(e){return e.id===view.selectedId;});
        if(idx!==-1) list.splice(idx,1);
        delete state.checks[checkKey(view.mode, view.selectedId)];
        view.selectedId = null;
        saveState();
        render();
      };
    }

    document.querySelectorAll('[data-scope-item]').forEach(function(c){
      c.onclick = function(){
        var m = c.dataset.scopeItem;
        var idx = view.newItemScope.indexOf(m);
        if(idx===-1) view.newItemScope.push(m); else view.newItemScope.splice(idx,1);
        render();
        var nameEl = document.getElementById('item-name');
        if(nameEl) nameEl.focus();
      };
    });

    document.querySelectorAll('[data-role-item]').forEach(function(c){
      c.onclick = function(){
        var r = c.dataset.roleItem;
        var idx = view.newItemRoles.indexOf(r);
        if(idx===-1) view.newItemRoles.push(r); else view.newItemRoles.splice(idx,1);
        render();
      };
    });

    document.querySelectorAll('[data-bring-new]').forEach(function(c){
      c.onclick = function(){
        view.newItemBring = (c.dataset.bringNew === 'bring');
        render();
      };
    });

    var addItemBtn = document.getElementById('add-item-btn');
    if(addItemBtn){
      addItemBtn.onclick = function(){
        var nameEl = document.getElementById('item-name');
        var name = nameEl.value.trim();
        if(!name){ nameEl.focus(); return; }
        var newItem = {id:uid(), name:name, scope:view.newItemScope.slice(), roles:view.newItemRoles.slice(), bring:view.newItemBring};
        state.items.push(newItem);
        if(newItem.roles.length===0){
          MODES.forEach(function(mode){
            if(newItem.scope.indexOf(mode)===-1) return;
            listForMode(mode).forEach(function(e){ e.itemIds.push(newItem.id); });
          });
        }
        view.newItemScope = ['studio','live','recording'];
        view.newItemRoles = [];
        view.newItemBring = true;
        saveState();
        render();
      };
    }

    document.querySelectorAll('[data-toggle-bring]').forEach(function(b){
      b.onclick = function(){
        var item = state.items.filter(function(it){return it.id===b.dataset.toggleBring;})[0];
        if(!item) return;
        item.bring = !isBring(item);
        saveState();
        render();
      };
    });

    var addRoleBtn = document.getElementById('add-role-btn');
    if(addRoleBtn){
      addRoleBtn.onclick = function(){
        var nameEl = document.getElementById('role-name');
        var name = nameEl.value.trim();
        if(!name){ nameEl.focus(); return; }
        if(state.roles.indexOf(name)===-1) state.roles.push(name);
        saveState();
        render();
      };
    }

    document.querySelectorAll('[data-role-up]').forEach(function(b){
      b.onclick = function(){
        var r = b.dataset.roleUp;
        var idx = state.roles.indexOf(r);
        if(idx>0){
          var tmp = state.roles[idx-1];
          state.roles[idx-1] = state.roles[idx];
          state.roles[idx] = tmp;
          saveState();
          render();
        }
      };
    });

    document.querySelectorAll('[data-role-down]').forEach(function(b){
      b.onclick = function(){
        var r = b.dataset.roleDown;
        var idx = state.roles.indexOf(r);
        if(idx!==-1 && idx<state.roles.length-1){
          var tmp = state.roles[idx+1];
          state.roles[idx+1] = state.roles[idx];
          state.roles[idx] = tmp;
          saveState();
          render();
        }
      };
    });

    document.querySelectorAll('[data-role-del]').forEach(function(b){
      b.onclick = function(){
        var r = b.dataset.roleDel;
        var idx = state.roles.indexOf(r);
        if(idx!==-1) state.roles.splice(idx,1);
        state.items.forEach(function(it){
          var i = (it.roles||[]).indexOf(r);
          if(i!==-1) it.roles.splice(i,1);
        });
        var ri = view.newItemRoles.indexOf(r);
        if(ri!==-1) view.newItemRoles.splice(ri,1);
        saveState();
        render();
      };
    });

    document.querySelectorAll('[data-item-del]').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.itemDel;
        var idx = state.items.findIndex(function(it){return it.id===id;});
        if(idx!==-1) state.items.splice(idx,1);
        state.studios.concat(state.lives, state.recordings).forEach(function(e){
          var i = e.itemIds.indexOf(id);
          if(i!==-1) e.itemIds.splice(i,1);
        });
        saveState();
        render();
      };
    });

    var resetAllBtn = document.getElementById('reset-all-btn');
    if(resetAllBtn){
      resetAllBtn.onclick = function(){
        view.confirmReset = true;
        render();
      };
    }

    var resetCancelBtn = document.getElementById('reset-cancel-btn');
    if(resetCancelBtn){
      resetCancelBtn.onclick = function(){
        view.confirmReset = false;
        render();
      };
    }

    var resetConfirmBtn = document.getElementById('reset-confirm-btn');
    if(resetConfirmBtn){
      resetConfirmBtn.onclick = function(){
        state = defaultState();
        view.selectedId = null;
        view.confirmReset = false;
        saveState();
        render();
      };
    }
  }

  render();
})();
</script>
</body>
</html>
